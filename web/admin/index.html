<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xyd · admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<style>
  :root { --bg:#000; --grey:#c6c6c6; --text:#ededed; --muted:#8c8c8c; --card:#0f0f0f; --card2:#161616; --line:#262626; --danger:#e5484d; --ok:#46a758; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); }
  body { font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:120px; }
  .wrap { max-width:960px; margin:0 auto; padding:0 16px; }
  header { position:sticky; top:0; z-index:5; background:rgba(0,0,0,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  header .wrap { display:flex; align-items:center; gap:12px; height:60px; }
  header svg { width:28px; height:28px; }
  header b { font-size:18px; letter-spacing:-.01em; }
  header .sp { flex:1; }
  header small { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40vw; }
  h2 { font-size:22px; margin:28px 0 14px; letter-spacing:-.01em; }
  h3 { font-size:16px; margin:0; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 6px; font-weight:600; }
  input[type=text],input[type=email],input[type=password],input[type=number],textarea,select {
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:10px;
    padding:11px 12px; font:inherit; outline:none; transition:border-color .15s;
  }
  input:focus,textarea:focus,select:focus { border-color:var(--grey); }
  textarea { min-height:96px; resize:vertical; }
  button,.btn { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 16px; cursor:pointer; background:var(--grey); color:#000; display:inline-flex; align-items:center; gap:8px; }
  button.ghost { background:transparent; color:var(--grey); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--danger); border:1px solid #3a1d1e; }
  button.link { background:none; padding:6px; color:var(--muted); font-weight:500; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media (max-width:640px) { .grid2 { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:16px; }
  .muted { color:var(--muted); }
  .err { color:var(--danger); margin-top:10px; min-height:20px; font-size:14px; }
  .center { min-height:80vh; display:grid; place-items:center; }
  .login { width:100%; max-width:360px; text-align:center; }
  .login svg { width:64px; height:64px; margin-bottom:12px; }
  .login form { text-align:left; margin-top:20px; }
  .login button { width:100%; justify-content:center; margin-top:20px; height:48px; }
  .titles { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px; }
  .tile { cursor:pointer; }
  .tile .poster { aspect-ratio:2/3; border-radius:10px; background:var(--card2) center/cover no-repeat; border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); font-weight:600; padding:8px; text-align:center; position:relative; }
  .tile .name { margin-top:6px; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { font-size:11px; padding:2px 7px; border-radius:20px; background:var(--card2); border:1px solid var(--line); color:var(--grey); }
  .badge.off { color:var(--danger); border-color:#3a1d1e; }
  .tile .badge { position:absolute; top:6px; left:6px; background:rgba(0,0,0,.7); }
  .imgs { display:flex; gap:16px; flex-wrap:wrap; }
  .imgbox { cursor:pointer; border:1px dashed var(--line); border-radius:10px; background:var(--card2) center/cover no-repeat; display:grid; place-items:center; color:var(--muted); font-size:13px; text-align:center; }
  .imgbox.poster { width:120px; aspect-ratio:2/3; }
  .imgbox.backdrop { width:240px; aspect-ratio:16/9; }
  .drop { border:1px dashed var(--line); border-radius:12px; padding:18px; text-align:center; color:var(--muted); cursor:pointer; transition:border-color .15s, background .15s; }
  .drop:hover,.drop.over { border-color:var(--grey); background:var(--card2); color:var(--grey); }
  .season { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .season:first-of-type { border-top:0; margin-top:0; padding-top:0; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  td { padding:6px 4px; border-bottom:1px solid #141414; vertical-align:middle; }
  td.n { width:36px; color:var(--muted); font-weight:600; }
  td.meta { color:var(--muted); font-size:13px; white-space:nowrap; width:1%; }
  td input { padding:7px 9px; border-radius:8px; }
  .uploads { position:fixed; left:0; right:0; bottom:0; z-index:9; background:rgba(10,10,10,.96); border-top:1px solid var(--line); max-height:40vh; overflow:auto; }
  .uploads .wrap { padding:12px 16px; }
  .up { display:grid; grid-template-columns:1fr auto; gap:4px 12px; font-size:13px; padding:6px 0; }
  .bar { grid-column:1/-1; height:4px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--grey); width:0; transition:width .2s; }
  .up.done .bar i { background:var(--ok); }
  .up.fail .bar i { background:var(--danger); }
  .toast { position:fixed; top:72px; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--line); padding:10px 16px; border-radius:10px; z-index:20; font-size:14px; }
  .handle { cursor:grab; color:var(--muted); user-select:none; width:24px; text-align:center; font-size:16px; }
  tr.dragging { opacity:.4; }
  tr.over-top td { box-shadow:inset 0 2px 0 var(--grey); }
  tr.over-bottom td { box-shadow:inset 0 -2px 0 var(--grey); }
  button.arrow { background:none; color:var(--muted); padding:4px 6px; font-weight:500; }
  button.arrow:hover:not(:disabled) { color:var(--text); }
  .chip { background:transparent; color:var(--grey); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-weight:500; }
  .chip.on { background:var(--grey); color:#000; border-color:var(--grey); }
  .cat { border-top:1px solid var(--line); padding:12px 0; }
  .cat:first-of-type { border-top:0; }
  .cat input[type=text] { max-width:260px; padding:8px 10px; }
  .cat-titles { margin:10px 0 0 4px; }
  .cat-titles .it { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:14px; }
  .cat-titles .it .rk { width:24px; color:var(--muted); font-weight:700; }
  .check { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--grey); }
  .meter { height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:6px; }
  .meter i { display:block; height:100%; background:var(--grey); }
  .meter i.warn { background:#f5a524; }
  .meter i.full { background:var(--danger); }
  .store { border-top:1px solid var(--line); padding:12px 0; }
  .store:first-of-type { border-top:0; }
  .store .tag { font-size:11px; padding:1px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); margin-left:6px; }
  .store.off { opacity:.5; }
  .sform { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><symbol id="logo" viewBox="351 351 1230 1230"><g fill="#C6C6C6"><path d="M736,357L845,367L999,627L938,697Z"/><path d="M1214,396L1396,396L548,1574L367,1574Z"/><path d="M1158,869L1565,1574L1109,1574L995,1378C940,1285 930,1140 1018,1050Z"/></g></symbol></svg>

<!-- Connexion -->
<section id="v-login" class="center" hidden>
  <div class="login wrap">
    <svg><use href="#logo"/></svg>
    <h2 style="margin:0">Admin xyd</h2>
    <p class="muted">Connecte-toi avec ton compte xyd.</p>
    <form id="f-login">
      <label for="l-email">Email</label>
      <input id="l-email" type="email" autocomplete="username" required>
      <label for="l-pass">Mot de passe</label>
      <input id="l-pass" type="password" autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
      <div class="err" id="l-err"></div>
    </form>
  </div>
</section>

<!-- Application -->
<section id="v-app" hidden>
  <header><div class="wrap">
    <svg><use href="#logo"/></svg><b>admin</b><span class="sp"></span>
    <small id="who"></small>
    <button class="link" id="b-logout">Déconnexion</button>
  </div></header>
  <main class="wrap" id="main"></main>
</section>

<div class="uploads" id="uploads" hidden><div class="wrap" id="uplist"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
// Injecté au déploiement par le workflow « Site ».
const SUPABASE_URL = "__SUPABASE_URL__";
const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY__";
if (!window.supabase) {
  document.body.innerHTML = '<p style="padding:24px">Impossible de charger Supabase (connexion ou bloqueur de contenu).</p>';
  throw new Error("supabase-js non chargé");
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
let titles = [];
let categories = [];     // [{ id, name, sort, ranked, items: [title_id, …] }]
let catsAvailable = true;
let storages = [];          // pool de stockages vidéo (table storage_backends)
let storagesAvailable = true;
let preferredStorage = "";  // "" = automatique, sinon id d'un stockage imposé
let poolRender = null;
const refreshPool = () => poolRender?.(); // false tant que la migration « categories » n'est pas appliquée
let uploading = 0;

// ---------------------------------------------------------------- utilitaires
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const fmtSize = (b) => !b ? "" : b >= 1 << 30 ? (b / 1073741824).toFixed(1).replace(".", ",") + " Go" : Math.round(b / 1048576) + " Mo";
const fmtDur = (s) => !s ? "" : s >= 3600 ? `${Math.floor(s / 3600)} h ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}` : `${Math.round(s / 60)} min`;
const pad = (n) => String(n).padStart(2, "0");
const rand = () => Math.random().toString(36).slice(2, 8);
const slug = (s) => (s || "x").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "x";
const extOf = (f) => { const e = (f.name.split(".").pop() || "").toLowerCase(); return ["mp4", "m4v", "mkv", "mov"].includes(e) ? e : "mp4"; };

function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), ms);
}
function fail(e) { console.error(e); toast("⚠️ " + (e?.message || e), 5000); }

/** Durée d'une vidéo locale (lecture des métadonnées par le navigateur). 0 si inconnue. */
function probeDuration(file) {
  return new Promise((res) => {
    const v = document.createElement("video");
    const url = URL.createObjectURL(file);
    const done = (d) => { URL.revokeObjectURL(url); res(Math.round(d || 0)); };
    const timer = setTimeout(() => done(0), 10000);
    v.preload = "metadata";
    v.onloadedmetadata = () => { clearTimeout(timer); done(isFinite(v.duration) ? v.duration : 0); };
    v.onerror = () => { clearTimeout(timer); done(0); };
    v.src = url;
  });
}

/** Nom d'épisode déduit du fichier : « Dark.S01E03.Le.passé.mp4 » → « Le passé ». */
function nameFromFile(f) {
  let n = f.name.replace(/\.[^.]+$/, "");
  n = n.replace(/.*?s\d{1,2}\s*e\d{1,3}/i, "").replace(/^[\s._-]*(e|ep|episode)?\s*\d{1,3}\b/i, "");
  n = n.replace(/[._]+/g, " ").replace(/\s+-\s+/g, " ").replace(/\b(1080p|720p|480p|x264|x265|h264|hevc|web[- ]?dl|bluray|multi|vostfr|french)\b.*/i, "");
  return n.trim().replace(/^-+|-+$/g, "").trim();
}

// ---------------------------------------------------------------- R2 & images
async function r2(body) {
  const { data, error } = await sb.functions.invoke("admin-r2", { body });
  if (error) {
    let msg = error.message;
    try { msg = (await error.context.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return data;
}
/** Supprime des vidéos de leur stockage et libère l'espace réservé. items : [{ key, storage_id, size }]. */
function storeDelete(items) {
  const list = items.filter((it) => it && it.key);
  if (!list.length) return null;
  for (const it of list) {
    const st = storages.find((x) => x.id === it.storage_id);
    if (st) st.used_bytes = Math.max(0, st.used_bytes - (it.size || 0));
  }
  return r2({ action: "delete", items: list }).catch(fail);
}
const videoOf = (x) => x?.video_key ? { key: x.video_key, storage_id: x.storage_id, size: x.size_bytes } : null;

/**
 * Envoie un fichier directement dans le stockage choisi par le pool (URL PUT pré-signée), avec progression.
 * Retourne l'id du stockage utilisé. L'espace est réservé côté serveur avant l'envoi et libéré en cas d'échec.
 */
async function uploadToStore(file, key, label) {
  const row = addUploadRow(label || file.name, file.size);
  uploading++;
  let storageId = null;
  try {
    const res = await r2({ action: "sign-upload", key, size: file.size, storage_id: preferredStorage || null });
    storageId = res.storage_id;
    const st = storages.find((x) => x.id === storageId);
    if (st) { st.used_bytes += file.size; row.dest(st.name); refreshPool(); }
    await new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open("PUT", res.url);
      x.upload.onprogress = (e) => e.lengthComputable && row.progress(e.loaded / e.total);
      x.onload = () => (x.status >= 200 && x.status < 300 ? resolve() : reject(new Error(`Le stockage a refusé l'envoi (HTTP ${x.status})`)));
      x.onerror = () => reject(new Error("Envoi interrompu (réseau ou CORS du bucket)"));
      x.send(file);
    });
    row.done();
    return storageId;
  } catch (e) {
    row.fail(e.message);
    if (storageId) {
      const st = storages.find((x) => x.id === storageId);
      if (st) { st.used_bytes = Math.max(0, st.used_bytes - file.size); refreshPool(); }
      r2({ action: "release", storage_id: storageId, size: file.size }).catch(() => {});
    }
    throw e;
  } finally {
    uploading--;
  }
}

function addUploadRow(name, size) {
  $("uploads").hidden = false;
  const bar = h("i");
  const status = h("span", { class: "muted" }, "0 %");
  const dest = h("span", { class: "muted" });
  const el = h("div", { class: "up" }, h("span", {}, name, " ", h("span", { class: "muted" }, fmtSize(size)), dest), status, h("div", { class: "bar" }, bar));
  $("uplist").prepend(el);
  return {
    dest(n) { dest.textContent = " → " + n; },
    progress(p) { bar.style.width = (p * 100).toFixed(1) + "%"; status.textContent = Math.floor(p * 100) + " %"; },
    done() { this.progress(1); el.classList.add("done"); status.textContent = "✓ envoyé"; setTimeout(() => { el.remove(); if (!$("uplist").children.length) $("uploads").hidden = true; }, 4000); },
    fail(m) { el.classList.add("fail"); bar.style.width = "100%"; status.textContent = "échec : " + m; },
  };
}

/** Redimensionne une image (JPEG) puis l'envoie dans le bucket public « posters ». */
async function uploadImage(file, titleId, kind) {
  const maxW = kind === "poster" ? 600 : 1280;
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxW / bmp.width);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  const path = `${titleId}/${kind}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from("posters").upload(path, blob, { contentType: "image/jpeg", upsert: false });
  if (error) throw error;
  return sb.storage.from("posters").getPublicUrl(path).data.publicUrl;
}

function pickFiles(accept, multiple) {
  return new Promise((res) => {
    const i = h("input", { type: "file", accept, multiple });
    i.onchange = () => res([...i.files]);
    i.click();
  });
}

// ---------------------------------------------------------------- données
async function load() {
  const { data, error } = await sb.from("titles")
    .select("*, seasons(*, episodes(*))")
    .order("sort").order("created_at", { ascending: false });
  if (error) throw error;
  for (const t of data) {
    t.seasons.sort((a, b) => a.number - b.number);
    for (const s of t.seasons) s.episodes.sort((a, b) => a.number - b.number);
  }
  titles = data;

  const st = await sb.from("storage_backends")
    .select("id, name, provider, endpoint, region, bucket, is_env, quota_bytes, used_bytes, priority, active, created_at, access_key_vault, secret_key_vault")
    .order("priority").order("created_at");
  storagesAvailable = !st.error;
  storages = st.data || [];

  const cats = await sb.from("categories")
    .select("id, name, sort, ranked, title_categories(title_id, position)")
    .order("sort").order("created_at");
  catsAvailable = !cats.error;
  categories = (cats.data || []).map((c) => ({
    id: c.id, name: c.name, sort: c.sort, ranked: c.ranked,
    items: (c.title_categories || []).sort((a, b) => a.position - b.position).map((x) => x.title_id),
  }));
}

// ---------------------------------------------------------------- vues
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: isAdmin, error } = await sb.rpc("is_admin");
  if (error || isAdmin !== true) {
    await sb.auth.signOut();
    return showLogin("Ce compte n'est pas administrateur.");
  }
  $("who").textContent = session.user.email;
  $("v-login").hidden = true;
  $("v-app").hidden = false;
  try { await load(); } catch (e) { fail(e); }
  renderList();
}

function showLogin(msg) {
  $("v-app").hidden = true;
  $("v-login").hidden = false;
  $("l-err").textContent = msg || "";
}

$("f-login").onsubmit = async (e) => {
  e.preventDefault();
  $("l-err").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("l-email").value.trim(), password: $("l-pass").value });
  if (error) return ($("l-err").textContent = /invalid/i.test(error.message) ? "Email ou mot de passe incorrect" : error.message);
  boot();
};
$("b-logout").onclick = async () => { await sb.auth.signOut(); showLogin(); };
window.addEventListener("beforeunload", (e) => { if (uploading) { e.preventDefault(); e.returnValue = ""; } });

function renderList() {
  const main = $("main");
  main.replaceChildren(
    h("div", { class: "row", style: { marginTop: "24px" } },
      h("h2", { style: { margin: 0, flex: 1 } }, "Catalogue"),
      h("button", { onclick: () => renderEditor(newTitle("serie")) }, "+ Série"),
      h("button", { onclick: () => renderEditor(newTitle("film")) }, "+ Film"),
    ),
    storagesAvailable ? storageCard() : "",
    catsAvailable ? categoriesCard() : "",
    titles.length ? h("div", { class: "titles", style: { marginTop: "20px" } },
      titles.map((t) => h("div", { class: "tile", onclick: () => renderEditor(t) },
        h("div", { class: "poster", style: t.poster_url ? { backgroundImage: `url("${t.poster_url}")` } : {} },
          t.poster_url ? "" : t.name,
          h("span", { class: "badge" + (t.published ? "" : " off") }, t.kind === "film" ? "Film" : `${t.seasons.length} saison${t.seasons.length > 1 ? "s" : ""}`, t.published ? "" : " · masqué")),
        h("div", { class: "name" }, t.name),
      )),
    ) : h("p", { class: "muted", style: { marginTop: "24px" } }, "Aucun contenu. Commence par ajouter une série ou un film."),
  );
}

function newTitle(kind) {
  return { _new: true, id: crypto.randomUUID(), kind, name: "", synopsis: "", year: new Date().getFullYear(), published: true, sort: 0, poster_url: null, backdrop_url: null, video_key: null, duration_s: 0, size_bytes: 0, seasons: [] };
}

function renderEditor(t) {
  const isFilm = t.kind === "film";
  const f = {
    name: h("input", { type: "text", value: t.name, placeholder: isFilm ? "Titre du film" : "Nom de la série" }),
    year: h("input", { type: "number", value: t.year || "", min: 1900, max: 2100 }),
    sort: h("input", { type: "number", value: t.sort ?? 0 }),
    synopsis: h("textarea", { placeholder: "Résumé" }),
    published: h("input", { type: "checkbox", checked: t.published }),
  };
  f.synopsis.value = t.synopsis || "";
  let pendingVideo = null; // nouveau film : vidéo choisie avant l'enregistrement
  const err = h("div", { class: "err" });

  const imgBox = (kind) => {
    const key = kind === "poster" ? "poster_url" : "backdrop_url";
    const box = h("div", { class: "imgbox " + kind, title: "Changer l'image" }, t[key] ? "" : (kind === "poster" ? "Affiche\n2:3" : "Image 16:9"));
    if (t[key]) box.style.backgroundImage = `url("${t[key]}")`;
    box.onclick = async () => {
      const [file] = await pickFiles("image/*");
      if (!file) return;
      box.textContent = "Envoi…";
      try {
        t[key] = await uploadImage(file, t.id, kind);
        box.textContent = ""; box.style.backgroundImage = `url("${t[key]}")`;
        if (!t._new) { await save({ [key]: t[key] }); toast("Image enregistrée"); }
      } catch (e) { box.textContent = "Erreur"; fail(e); }
    };
    return box;
  };

  async function save(patch) {
    const { error } = await sb.from("titles").update(patch).eq("id", t.id);
    if (error) throw error;
    Object.assign(t, patch);
  }

  // --- vidéo du film
  const videoInfo = h("p", { class: "muted" });
  const showVideoInfo = () => {
    videoInfo.textContent = pendingVideo ? `Prêt à envoyer : ${pendingVideo.name} (${fmtSize(pendingVideo.size)})`
      : t.video_key ? `${t.video_key} · ${fmtSize(t.size_bytes)} · ${fmtDur(t.duration_s)}` : "Aucune vidéo";
  };
  showVideoInfo();
  const pickFilmVideo = async (files) => {
    const [file] = files || await pickFiles("video/*,.mkv");
    if (!file) return;
    if (t._new) { pendingVideo = file; showVideoInfo(); return; }
    if (!(await confirmPlan([file]))) return;
    try {
      const old = videoOf(t);
      const key = `films/${slug(f.name.value || t.name)}-${t.id.slice(0, 8)}-${rand()}.${extOf(file)}`;
      const duration = await probeDuration(file);
      const storageId = await uploadToStore(file, key, t.name);
      await save({ video_key: key, storage_id: storageId, size_bytes: file.size, duration_s: duration || t.duration_s });
      if (old && old.key !== key) storeDelete([old]);
      showVideoInfo(); toast("Vidéo remplacée");
    } catch (e) { fail(e); }
  };

  // --- enregistrement
  const saveBtn = h("button", { onclick: async () => {
    err.textContent = "";
    const row = {
      name: f.name.value.trim(), synopsis: f.synopsis.value.trim(), year: Number(f.year.value) || null,
      sort: Number(f.sort.value) || 0, published: f.published.checked,
      poster_url: t.poster_url, backdrop_url: t.backdrop_url,
    };
    if (!row.name) return (err.textContent = "Le nom est obligatoire.");
    saveBtn.disabled = true;
    try {
      if (t._new) {
        if (isFilm) {
          if (!pendingVideo) { saveBtn.disabled = false; return (err.textContent = "Choisis la vidéo du film."); }
          if (!(await confirmPlan([pendingVideo]))) { saveBtn.disabled = false; return; }
          const key = `films/${slug(row.name)}-${t.id.slice(0, 8)}-${rand()}.${extOf(pendingVideo)}`;
          const duration = await probeDuration(pendingVideo);
          const storageId = await uploadToStore(pendingVideo, key, row.name);
          Object.assign(row, { video_key: key, storage_id: storageId, size_bytes: pendingVideo.size, duration_s: duration });
          pendingVideo = null;
        }
        const { data, error } = await sb.from("titles").insert({ id: t.id, kind: t.kind, ...row }).select("*").single();
        if (error) { if (row.video_key) storeDelete([videoOf(row)]); throw error; }
        Object.assign(t, data, { seasons: [] });
        delete t._new;
        titles.unshift(t);
        toast(isFilm ? "Film ajouté" : "Série créée — ajoute une saison");
        renderEditor(t);
        return;
      }
      await save(row);
      toast("Enregistré");
    } catch (e) { err.textContent = e.message; }
    saveBtn.disabled = false;
  } }, t._new ? (isFilm ? "Envoyer et créer le film" : "Créer la série") : "Enregistrer");

  const delBtn = !t._new && h("button", { class: "danger", onclick: async () => {
    const n = t.seasons.reduce((a, s) => a + s.episodes.length, 0);
    if (!confirm(`Supprimer « ${t.name} »${n ? ` et ses ${n} épisodes` : ""} ? Les vidéos seront effacées du stockage.`)) return;
    const vids = [videoOf(t), ...t.seasons.flatMap((s) => s.episodes.map(videoOf))];
    const { error } = await sb.from("titles").delete().eq("id", t.id);
    if (error) return fail(error);
    storeDelete(vids);
    titles = titles.filter((x) => x !== t);
    toast("Supprimé");
    renderList();
  } }, "Supprimer");

  const filmDrop = isFilm && dropZone("Glisse la vidéo ici ou clique pour choisir", pickFilmVideo, false);

  $("main").replaceChildren(
    h("div", { class: "row", style: { marginTop: "20px" } },
      h("button", { class: "link", onclick: renderList }, "← Catalogue"),
    ),
    h("h2", {}, t._new ? (isFilm ? "Nouveau film" : "Nouvelle série") : t.name),
    h("div", { class: "card" },
      h("label", {}, "Nom"), f.name,
      h("div", { class: "grid2" },
        h("div", {}, h("label", {}, "Année"), f.year),
        h("div", {}, h("label", {}, "Ordre d'affichage (petit = en premier)"), f.sort),
      ),
      h("label", {}, "Résumé"), f.synopsis,
      h("label", {}, "Images"),
      h("div", { class: "imgs" }, imgBox("poster"), imgBox("backdrop")),
      h("label", { style: { display: "flex", alignItems: "center", gap: "8px", textTransform: "none", letterSpacing: 0, fontSize: "14px", color: "var(--text)" } },
        f.published, "Visible dans l'app"),
      catsAvailable && categories.length ? h("div", {},
        h("label", {}, "Catégories"),
        t._new ? h("p", { class: "muted" }, "Disponible après la création.") : titleCategoryChips(t),
      ) : "",
      isFilm && h("div", {}, h("label", {}, "Vidéo"), videoInfo, filmDrop),
      h("div", { class: "row", style: { marginTop: "20px" } }, saveBtn, h("span", { class: "sp", style: { flex: 1 } }), delBtn),
      err,
    ),
    !isFilm && !t._new ? seasonsCard(t) : "",
  );
  if (t._new) f.name.focus();
}

function dropZone(text, onFiles, multiple) {
  const z = h("div", { class: "drop" }, text);
  z.onclick = async () => onFiles(await pickFiles("video/*,.mkv", multiple));
  z.ondragover = (e) => { e.preventDefault(); z.classList.add("over"); };
  z.ondragleave = () => z.classList.remove("over");
  z.ondrop = (e) => {
    e.preventDefault(); z.classList.remove("over");
    const files = [...e.dataTransfer.files].filter((f) => /^video\//.test(f.type) || /\.(mkv|mp4|m4v|mov)$/i.test(f.name));
    if (files.length) onFiles(multiple ? files : files.slice(0, 1));
  };
  return z;
}

// ---------------------------------------------------------------- stockages (pool)
const fmtBytes = (b) => !b ? "0 Go" : b >= 1e9 ? (b / 1e9).toFixed(2).replace(".", ",") + " Go" : Math.round(b / 1e6) + " Mo";
const pct = (used, quota) => quota > 0 ? Math.round((used / quota) * 100) : 100;
const PROVIDERS = { r2: "Cloudflare R2", b2: "Backblaze B2", s3: "Autre S3" };

function meter(used, quota) {
  const p = pct(used, quota);
  return h("div", { class: "meter" }, h("i", { class: p >= 100 ? "full" : p >= 90 ? "warn" : "", style: { width: Math.min(100, p) + "%" } }));
}

/** Ordre de remplissage : stockages actifs, par priorité (ou celui imposé). */
function fillOrder() {
  return storages
    .filter((x) => x.active && (!preferredStorage || x.id === preferredStorage))
    .sort((a, b) => a.priority - b.priority || String(a.created_at).localeCompare(String(b.created_at)));
}

/** Simule la répartition d'un envoi (même algorithme que le serveur : premier stockage qui a la place). */
function simulate(files) {
  const pool = fillOrder().map((x) => ({ st: x, free: Math.max(0, x.quota_bytes - x.used_bytes), add: 0 }));
  const missing = [];
  for (const f of files) {
    const slot = pool.find((p) => p.free >= f.size);
    if (slot) { slot.free -= f.size; slot.add += f.size; } else missing.push(f);
  }
  return { slots: pool.filter((p) => p.add > 0), missing };
}

/** Affiche le plan d'envoi ; demande confirmation s'il y a un risque (débordement, stockage presque plein). */
async function confirmPlan(files) {
  if (!storagesAvailable || !storages.length) return true;
  const total = files.reduce((a, f) => a + f.size, 0);
  const { slots, missing } = simulate(files);
  const lines = [`Envoi : ${files.length} fichier${files.length > 1 ? "s" : ""} · ${fmtBytes(total)}`];
  const warns = [];
  for (const sl of slots) {
    const after = sl.st.used_bytes + sl.add;
    const p = pct(after, sl.st.quota_bytes);
    lines.push(`→ ${sl.st.name} : +${fmtBytes(sl.add)} (après : ${fmtBytes(after)} / ${fmtBytes(sl.st.quota_bytes)}, ${p} %)`);
    if (p >= 90) warns.push(`⚠️ ${sl.st.name} sera rempli à ${p} %.`);
  }
  if (missing.length) {
    warns.push(`⛔ ${missing.length} fichier${missing.length > 1 ? "s" : ""} (${fmtBytes(missing.reduce((a, f) => a + f.size, 0))}) ne rentre${missing.length > 1 ? "nt" : ""} dans aucun stockage : ${missing.length > 1 ? "ils échoueront" : "il échouera"}. Ajoute un stockage ou augmente un quota.`);
  }
  const act = fillOrder();
  const poolUsed = act.reduce((a, x) => a + x.used_bytes, 0) + total;
  const poolQuota = act.reduce((a, x) => a + x.quota_bytes, 0);
  if (poolQuota && pct(poolUsed, poolQuota) >= 90) warns.push(`⚠️ Le pool sera rempli à ${pct(poolUsed, poolQuota)} % au total.`);
  if (warns.length) return confirm([...lines, "", ...warns, "", "Continuer l'envoi ?"].join("\n"));
  toast(lines.join(" · "), 4000);
  return true;
}

function storageCard() {
  const card = h("div", { class: "card" });
  let editing = null; // null | "new" | storage

  const render = () => {
    const act = storages.filter((x) => x.active);
    const used = act.reduce((a, x) => a + x.used_bytes, 0);
    const quota = act.reduce((a, x) => a + x.quota_bytes, 0);
    const dest = h("select", { style: { maxWidth: "220px" }, title: "Où envoyer les prochaines vidéos" },
      h("option", { value: "" }, "Destination : automatique"),
      ...storages.filter((x) => x.active).map((x) => h("option", { value: x.id, selected: x.id === preferredStorage }, "Uniquement : " + x.name)),
    );
    dest.onchange = () => { preferredStorage = dest.value; };
    card.replaceChildren(
      h("div", { class: "row" },
        h("h3", { style: { flex: 1 } }, "Stockages vidéo"),
        dest,
        h("button", { class: "ghost", onclick: recompute, title: "Recalcule l'espace utilisé à partir des vidéos enregistrées" }, "Recalculer"),
        h("button", { class: "ghost", onclick: () => { editing = "new"; render(); } }, "+ Stockage"),
      ),
      h("div", { style: { marginTop: "10px" } },
        h("div", { class: "row", style: { fontSize: "14px" } },
          h("span", { style: { flex: 1 } }, `Pool : ${fmtBytes(used)} / ${fmtBytes(quota)}`),
          h("span", { class: "muted" }, `${pct(used, quota)} % · reste ${fmtBytes(Math.max(0, quota - used))}`)),
        meter(used, quota),
      ),
      editing === "new" ? storageForm(null) : "",
      h("div", { style: { marginTop: "8px" } }, ...storages.map((x) => storeRow(x))),
    );
  };
  poolRender = render;

  async function recompute() {
    const { error } = await sb.rpc("recompute_storage_usage");
    if (error) return fail(error);
    const { data } = await sb.from("storage_backends").select("id, used_bytes");
    for (const r of data || []) { const x = storages.find((y) => y.id === r.id); if (x) x.used_bytes = r.used_bytes; }
    render(); toast("Espace recalculé");
  }

  function storeRow(x) {
    const p = pct(x.used_bytes, x.quota_bytes);
    const status = h("span", { class: "muted", style: { fontSize: "13px" } });
    const test = async () => {
      status.textContent = "Test…";
      try {
        const r = await r2({ action: "test", storage_id: x.id });
        status.textContent = r.ok ? "✓ connexion OK" : "✗ " + r.error;
        status.style.color = r.ok ? "var(--ok)" : "var(--danger)";
      } catch (e) { status.textContent = "✗ " + e.message; status.style.color = "var(--danger)"; }
    };
    return h("div", { class: "store" + (x.active ? "" : " off") },
      h("div", { class: "row" },
        h("b", {}, x.name),
        h("span", { class: "tag" }, PROVIDERS[x.provider] || x.provider),
        x.is_env ? h("span", { class: "tag" }, "secrets GitHub") : "",
        x.active ? "" : h("span", { class: "tag" }, "désactivé"),
        h("span", { class: "tag" }, "priorité " + x.priority),
        h("span", { style: { flex: 1 } }),
        h("span", { class: "muted", style: { fontSize: "13px" } }, `${fmtBytes(x.used_bytes)} / ${fmtBytes(x.quota_bytes)} · ${p} %`),
      ),
      meter(x.used_bytes, x.quota_bytes),
      h("div", { class: "row", style: { marginTop: "6px", gap: "4px" } },
        h("button", { class: "link", onclick: test }, "Tester"),
        h("button", { class: "link", onclick: () => { editing = editing === x ? null : x; render(); } }, editing === x ? "Fermer" : "Modifier"),
        x.is_env ? "" : h("button", { class: "link", onclick: async () => {
          if (!confirm(`Supprimer le stockage « ${x.name} » ? (impossible s'il contient encore des vidéos)`)) return;
          const { error } = await sb.rpc("admin_delete_storage", { p_id: x.id });
          if (error) return fail(error);
          storages = storages.filter((y) => y !== x);
          if (preferredStorage === x.id) preferredStorage = "";
          render(); toast("Stockage supprimé");
        } }, "Supprimer"),
        status,
      ),
      editing === x ? storageForm(x) : "",
    );
  }

  function storageForm(x) {
    const isNew = !x;
    const envOnly = x?.is_env;
    const v = {
      name: h("input", { type: "text", value: x?.name || "", placeholder: "ex : R2 compte 2, Backblaze…" }),
      provider: h("select", {}, ...Object.entries(PROVIDERS).map(([k, l]) => h("option", { value: k, selected: (x?.provider || "r2") === k }, l))),
      account: h("input", { type: "text", placeholder: "Account ID Cloudflare (32 caractères)" }),
      endpoint: h("input", { type: "text", value: x?.endpoint || "", placeholder: "https://s3.eu-central-003.backblazeb2.com" }),
      region: h("input", { type: "text", value: x?.region && x.region !== "auto" ? x.region : "", placeholder: "ex : eu-central-003 (auto pour R2)" }),
      bucket: h("input", { type: "text", value: x?.bucket || "", placeholder: "nom du bucket" }),
      ak: h("input", { type: "password", autocomplete: "off", placeholder: x?.access_key_vault ? "•••• enregistrée — vide = inchangée" : "Access Key ID / keyID" }),
      sk: h("input", { type: "password", autocomplete: "off", placeholder: x?.secret_key_vault ? "•••• enregistrée — vide = inchangée" : "Secret Access Key / applicationKey" }),
      quota: h("input", { type: "number", step: "0.1", min: "0.1", value: x ? (x.quota_bytes / 1e9).toFixed(1) : "9.5" }),
      priority: h("input", { type: "number", value: x?.priority ?? (Math.max(0, ...storages.map((y) => y.priority)) + 1) }),
      active: h("input", { type: "checkbox", checked: x ? x.active : true }),
    };
    // R2 : l'endpoint se déduit de l'Account ID.
    const m = /^https:\/\/([0-9a-f]{32})\.r2\.cloudflarestorage\.com/i.exec(x?.endpoint || "");
    if (m) v.account.value = m[1];
    const err = h("div", { class: "err" });
    const fields = h("div");
    const layout = () => {
      const pr = v.provider.value;
      fields.replaceChildren(
        envOnly ? h("p", { class: "muted", style: { fontSize: "13px" } }, "Stockage d'origine : ses clés sont dans les secrets GitHub (R2_*). Seuls le nom, le quota, la priorité et l'état se modifient ici.") : h("div", {},
          h("label", {}, "Type"), v.provider,
          pr === "r2" ? h("div", {}, h("label", {}, "Account ID Cloudflare"), v.account)
                      : h("div", { class: "grid2" },
                          h("div", {}, h("label", {}, "Endpoint S3"), v.endpoint),
                          h("div", {}, h("label", {}, "Région"), v.region)),
          h("label", {}, "Bucket"), v.bucket,
          h("div", { class: "grid2" },
            h("div", {}, h("label", {}, pr === "b2" ? "keyID" : "Access Key ID"), v.ak),
            h("div", {}, h("label", {}, pr === "b2" ? "applicationKey" : "Secret Access Key"), v.sk)),
        ),
      );
    };
    v.provider.onchange = layout;
    layout();

    const save = h("button", { onclick: async () => {
      err.textContent = "";
      const pr = v.provider.value;
      let endpoint = v.endpoint.value.trim().replace(/\/+$/, "");
      let region = v.region.value.trim();
      if (!envOnly && pr === "r2") {
        const acct = v.account.value.trim();
        if (!/^[0-9a-f]{32}$/i.test(acct)) return (err.textContent = "Account ID Cloudflare invalide (32 caractères hexadécimaux).");
        endpoint = `https://${acct}.r2.cloudflarestorage.com`; region = "auto";
      }
      if (!envOnly && pr === "b2" && !region) {
        const r = /s3\.([a-z0-9-]+)\.backblazeb2\.com/i.exec(endpoint); // la région est dans l'endpoint B2
        if (r) region = r[1];
      }
      const name = v.name.value.trim();
      const quotaBytes = Math.round(Number(v.quota.value) * 1e9);
      if (!name) return (err.textContent = "Donne un nom à ce stockage.");
      if (!(quotaBytes > 0)) return (err.textContent = "Quota invalide.");
      if (!envOnly) {
        if (!/^https:\/\//.test(endpoint)) return (err.textContent = "Endpoint invalide (doit commencer par https://).");
        if (!v.bucket.value.trim()) return (err.textContent = "Nom du bucket obligatoire.");
        if (isNew && (!v.ak.value.trim() || !v.sk.value.trim())) return (err.textContent = "Les deux clés sont obligatoires.");
      }
      save.disabled = true;
      const { data: id, error } = await sb.rpc("admin_save_storage", {
        p_id: x?.id || null, p_name: name, p_provider: envOnly ? x.provider : pr, p_endpoint: endpoint || null,
        p_region: region || "auto", p_bucket: v.bucket.value.trim() || null,
        p_access_key: v.ak.value.trim(), p_secret_key: v.sk.value.trim(),
        p_quota_bytes: quotaBytes, p_priority: Number(v.priority.value) || 0, p_active: v.active.checked,
      });
      save.disabled = false;
      if (error) return (err.textContent = error.message);
      const { data } = await sb.from("storage_backends")
        .select("id, name, provider, endpoint, region, bucket, is_env, quota_bytes, used_bytes, priority, active, created_at, access_key_vault, secret_key_vault")
        .eq("id", id).single();
      if (data) {
        const i = storages.findIndex((y) => y.id === id);
        i >= 0 ? (storages[i] = data) : storages.push(data);
        storages.sort((a, b) => a.priority - b.priority || String(a.created_at).localeCompare(String(b.created_at)));
      }
      editing = null; render();
      toast(isNew ? "Stockage ajouté — clique sur « Tester »" : "Stockage enregistré");
    } }, isNew ? "Ajouter" : "Enregistrer");

    return h("div", { class: "sform" },
      h("label", {}, "Nom"), v.name,
      fields,
      h("div", { class: "grid2" },
        h("div", {}, h("label", {}, "Quota (Go) — garde une marge sous la limite gratuite"), v.quota),
        h("div", {}, h("label", {}, "Priorité (petit = rempli en premier)"), v.priority)),
      h("label", { class: "check", style: { marginTop: "12px" } }, v.active, "Actif (reçoit de nouvelles vidéos)"),
      h("div", { class: "row", style: { marginTop: "14px" } }, save,
        h("button", { class: "ghost", onclick: () => { editing = null; render(); } }, "Annuler")),
      err,
    );
  }

  render();
  return card;
}

// ---------------------------------------------------------------- catégories
const titleById = (id) => titles.find((t) => t.id === id);
const moveIn = (arr, from, to) => { const a = arr.slice(); const [x] = a.splice(from, 1); a.splice(to, 0, x); return a; };

async function setCategoryTitles(c, ids) {
  const { error } = await sb.rpc("reorder_category_titles", { p_category: c.id, p_title_ids: ids });
  if (error) throw error;
  c.items = ids;
}

async function addToCategory(c, titleId) {
  const { error } = await sb.from("title_categories").insert({ category_id: c.id, title_id: titleId, position: c.items.length + 1 });
  if (error) throw error;
  c.items = [...c.items, titleId];
}

async function removeFromCategory(c, titleId) {
  const { error } = await sb.from("title_categories").delete().eq("category_id", c.id).eq("title_id", titleId);
  if (error) throw error;
  c.items = c.items.filter((x) => x !== titleId);
}

/** Pastilles cliquables dans la fiche d'un titre : ajoute / retire de chaque catégorie. */
function titleCategoryChips(t) {
  const box = h("div", { class: "row", style: { gap: "8px" } });
  const render = () => box.replaceChildren(...categories.map((c) => {
    const on = c.items.includes(t.id);
    return h("button", { class: "chip" + (on ? " on" : ""), onclick: async () => {
      try {
        on ? await removeFromCategory(c, t.id) : await addToCategory(c, t.id);
        render();
      } catch (e) { fail(e); }
    } }, (on ? "✓ " : "+ ") + c.name);
  }));
  render();
  return box;
}

const openCats = new Set();

/** Carte de gestion des catégories (accueil de l'admin). */
function categoriesCard() {
  const card = h("div", { class: "card" });
  const render = () => {
    card.replaceChildren(
      h("div", { class: "row" },
        h("h3", { style: { flex: 1 } }, "Catégories (rangées de l'accueil)"),
        h("button", { class: "ghost", onclick: addCategory }, "+ Catégorie"),
      ),
      categories.length ? "" : h("p", { class: "muted", style: { marginTop: "10px" } }, "Aucune catégorie."),
      h("div", { style: { marginTop: "8px" } }, ...categories.map((c, i) => catBlock(c, i))),
    );
  };

  async function addCategory() {
    const name = prompt("Nom de la catégorie (ex : Top 10, Anime, Nouveautés…)");
    if (!name?.trim()) return;
    const sort = Math.max(0, ...categories.map((c) => c.sort)) + 1;
    const { data, error } = await sb.from("categories").insert({ name: name.trim(), sort }).select("*").single();
    if (error) return fail(error);
    categories.push({ id: data.id, name: data.name, sort: data.sort, ranked: data.ranked, items: [] });
    openCats.add(data.id);
    render();
  }

  async function reorder(list) {
    const { error } = await sb.rpc("reorder_categories", { p_ids: list.map((c) => c.id) });
    if (error) return fail(error);
    list.forEach((c, i) => (c.sort = i + 1));
    categories = list;
    render();
  }

  function catBlock(c, i) {
    const name = h("input", { type: "text", value: c.name });
    name.onchange = async () => {
      const v = name.value.trim();
      if (!v) return (name.value = c.name);
      const { error } = await sb.from("categories").update({ name: v }).eq("id", c.id);
      error ? fail(error) : (c.name = v, toast("Catégorie renommée"));
    };
    const ranked = h("input", { type: "checkbox", checked: c.ranked });
    ranked.onchange = async () => {
      const { error } = await sb.from("categories").update({ ranked: ranked.checked }).eq("id", c.id);
      error ? (fail(error), (ranked.checked = c.ranked)) : (c.ranked = ranked.checked, toast(c.ranked ? "Affichage classement activé" : "Affichage classement désactivé"));
    };
    const open = openCats.has(c.id);
    const block = h("div", { class: "cat" },
      h("div", { class: "row" },
        name,
        h("label", { class: "check", title: "Grands numéros 1, 2, 3… comme un Top 10" }, ranked, "Classement"),
        h("span", { class: "muted", style: { fontSize: "13px" } }, `${c.items.length} titre${c.items.length > 1 ? "s" : ""}`),
        h("span", { style: { flex: 1 } }),
        h("button", { class: "arrow", title: "Monter", disabled: i === 0, onclick: () => reorder(moveIn(categories, i, i - 1)) }, "↑"),
        h("button", { class: "arrow", title: "Descendre", disabled: i === categories.length - 1, onclick: () => reorder(moveIn(categories, i, i + 1)) }, "↓"),
        h("button", { class: "link", onclick: () => { open ? openCats.delete(c.id) : openCats.add(c.id); render(); } }, open ? "Fermer" : "Gérer"),
        h("button", { class: "link", title: "Supprimer la catégorie", onclick: async () => {
          if (!confirm(`Supprimer la catégorie « ${c.name} » ? (les titres ne sont pas supprimés)`)) return;
          const { error } = await sb.from("categories").delete().eq("id", c.id);
          if (error) return fail(error);
          categories = categories.filter((x) => x !== c);
          render();
        } }, "✕"),
      ),
      open ? catTitles(c) : "",
    );
    return block;
  }

  function catTitles(c) {
    const others = titles.filter((t) => !c.items.includes(t.id));
    const select = h("select", { style: { maxWidth: "320px" } },
      h("option", { value: "" }, others.length ? "+ Ajouter un titre…" : "Tous les titres sont déjà dedans"),
      ...others.map((t) => h("option", { value: t.id }, `${t.name} (${t.kind === "film" ? "film" : "série"})`)),
    );
    select.onchange = async () => {
      if (!select.value) return;
      try { await addToCategory(c, select.value); render(); } catch (e) { fail(e); }
    };
    const items = c.items.map(titleById).filter(Boolean);
    return h("div", { class: "cat-titles" },
      ...items.map((t, j) => h("div", { class: "it" },
        h("span", { class: "rk" }, c.ranked ? `${j + 1}` : "•"),
        h("span", { style: { flex: 1 } }, t.name, " ", h("span", { class: "muted", style: { fontSize: "12px" } }, t.kind === "film" ? "film" : "série")),
        h("button", { class: "arrow", disabled: j === 0, onclick: async () => { try { await setCategoryTitles(c, moveIn(c.items, c.items.indexOf(t.id), c.items.indexOf(t.id) - 1)); render(); } catch (e) { fail(e); } } }, "↑"),
        h("button", { class: "arrow", disabled: j === items.length - 1, onclick: async () => { try { await setCategoryTitles(c, moveIn(c.items, c.items.indexOf(t.id), c.items.indexOf(t.id) + 1)); render(); } catch (e) { fail(e); } } }, "↓"),
        h("button", { class: "link", title: "Retirer de la catégorie", onclick: async () => { try { await removeFromCategory(c, t.id); render(); } catch (e) { fail(e); } } }, "✕"),
      )),
      h("div", { style: { marginTop: "8px" } }, select),
    );
  }

  render();
  return card;
}

// ---------------------------------------------------------------- saisons & épisodes
function seasonsCard(t) {
  const card = h("div", { class: "card" });
  const render = () => {
    card.replaceChildren(
      h("div", { class: "row" },
        h("h3", { style: { flex: 1 } }, "Saisons & épisodes"),
        h("button", { class: "ghost", onclick: addSeason }, "+ Saison"),
      ),
      t.seasons.length ? "" : h("p", { class: "muted", style: { marginTop: "10px" } }, "Ajoute une première saison."),
      ...t.seasons.map((s, si) => seasonBlock(s, si)),
    );
  };

  // Renumérotation atomique côté base (contraintes d'unicité différées).
  async function reorderEpisodes(s, list) {
    if (uploading) return toast("Attends la fin des envois pour réordonner");
    const { error } = await sb.rpc("reorder_episodes", { p_season: s.id, p_ids: list.map((e) => e.id) });
    if (error) return fail(error);
    list.forEach((e, i) => (e.number = i + 1));
    s.episodes = list;
    render();
  }

  async function reorderSeasons(list) {
    if (uploading) return toast("Attends la fin des envois pour réordonner");
    const { error } = await sb.rpc("reorder_seasons", { p_title: t.id, p_ids: list.map((x) => x.id) });
    if (error) return fail(error);
    list.forEach((x, i) => (x.number = i + 1));
    t.seasons = list;
    render();
  }

  const moved = (arr, from, to) => { const a = arr.slice(); const [x] = a.splice(from, 1); a.splice(to, 0, x); return a; };
  let dragged = null; // { season, episode }

  let adding = false;
  async function addSeason(ev) {
    if (adding) return;
    adding = true;
    if (ev?.currentTarget) ev.currentTarget.disabled = true;
    const number = Math.max(0, ...t.seasons.map((s) => s.number)) + 1;
    const { data, error } = await sb.from("seasons").insert({ title_id: t.id, number, name: `Saison ${number}` }).select("*").single();
    adding = false;
    if (error) { render(); return fail(error); }
    data.episodes = [];
    t.seasons.push(data);
    render();
  }

  function seasonBlock(s, si) {
    const nameInput = h("input", { type: "text", value: s.name, style: { maxWidth: "240px" } });
    nameInput.onchange = async () => {
      const { error } = await sb.from("seasons").update({ name: nameInput.value.trim() }).eq("id", s.id);
      error ? fail(error) : (s.name = nameInput.value.trim(), toast("Saison renommée"));
    };
    const tbody = h("tbody");
    const renderEps = () => tbody.replaceChildren(...s.episodes.map((e) => episodeRow(s, e, renderEps)));
    renderEps();

    const addEpisodes = async (files) => {
      files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      if (!(await confirmPlan(files))) return;
      // Les envois partent l'un après l'autre ; chaque épisode est créé dès que sa vidéo est en ligne.
      for (const file of files) {
        const number = Math.max(0, ...s.episodes.map((e) => e.number)) + 1;
        const key = `series/${slug(t.name)}-${t.id.slice(0, 8)}/s${pad(s.number)}/e${pad(number)}-${rand()}.${extOf(file)}`;
        try {
          const duration = await probeDuration(file);
          // Réserve le numéro pendant l'envoi pour que les fichiers suivants prennent les numéros d'après.
          const placeholder = { number, name: "…", _pending: true };
          s.episodes.push(placeholder);
          renderEps();
          let storageId;
          try {
            storageId = await uploadToStore(file, key, `${t.name} · S${pad(s.number)}E${pad(number)}`);
          } finally {
            s.episodes = s.episodes.filter((x) => x !== placeholder);
          }
          const { data, error } = await sb.from("episodes").insert({
            season_id: s.id, number, name: nameFromFile(file) || `Épisode ${number}`,
            video_key: key, storage_id: storageId, duration_s: duration, size_bytes: file.size,
          }).select("*").single();
          if (error) { storeDelete([{ key, storage_id: storageId, size: file.size }]); throw error; }
          s.episodes.push(data);
          s.episodes.sort((a, b) => a.number - b.number);
          renderEps();
        } catch (e) { fail(e); renderEps(); }
      }
    };

    const del = h("button", { class: "link", title: "Supprimer la saison", onclick: async () => {
      if (!confirm(`Supprimer ${s.name || "la saison " + s.number} et ses ${s.episodes.length} épisodes ?`)) return;
      const { error } = await sb.from("seasons").delete().eq("id", s.id);
      if (error) return fail(error);
      storeDelete(s.episodes.map(videoOf));
      t.seasons = t.seasons.filter((x) => x !== s);
      render();
    } }, "Supprimer");

    return h("div", { class: "season" },
      h("div", { class: "row" }, h("b", { class: "muted" }, `S${pad(s.number)}`), nameInput, h("span", { style: { flex: 1 } }),
        h("button", { class: "arrow", title: "Monter la saison", disabled: si === 0,
          onclick: () => reorderSeasons(moved(t.seasons, si, si - 1)) }, "↑"),
        h("button", { class: "arrow", title: "Descendre la saison", disabled: si === t.seasons.length - 1,
          onclick: () => reorderSeasons(moved(t.seasons, si, si + 1)) }, "↓"),
        del),
      h("table", {}, tbody),
      h("div", { style: { marginTop: "10px" } },
        dropZone("Glisse les vidéos des épisodes ici (plusieurs à la fois) ou clique pour choisir", addEpisodes, true)),
    );
  }

  function episodeRow(s, e, rerender) {
    if (e._pending) return h("tr", {}, h("td", {}), h("td", { class: "n" }, e.number), h("td", { class: "muted", colspan: 3 }, "envoi en cours…"));
    const name = h("input", { type: "text", value: e.name });
    name.onchange = async () => {
      const { error } = await sb.from("episodes").update({ name: name.value.trim() }).eq("id", e.id);
      error ? fail(error) : (e.name = name.value.trim(), toast("Épisode renommé"));
    };
    const syn = h("button", { class: "link", title: "Résumé de l'épisode", onclick: async () => {
      const v = prompt(`Résumé de l'épisode ${e.number}`, e.synopsis || "");
      if (v == null) return;
      const { error } = await sb.from("episodes").update({ synopsis: v.trim() }).eq("id", e.id);
      error ? fail(error) : (e.synopsis = v.trim(), toast("Résumé enregistré"));
    } }, e.synopsis ? "✎ résumé" : "+ résumé");
    const del = h("button", { class: "link", title: "Supprimer", onclick: async () => {
      if (!confirm(`Supprimer l'épisode ${e.number} « ${e.name} » ?`)) return;
      const { error } = await sb.from("episodes").delete().eq("id", e.id);
      if (error) return fail(error);
      storeDelete([videoOf(e)]);
      s.episodes = s.episodes.filter((x) => x !== e);
      rerender();
    } }, "✕");
    const i = s.episodes.indexOf(e);
    const last = s.episodes.length - 1;
    const up = h("button", { class: "arrow", title: "Monter", disabled: i === 0,
      onclick: () => reorderEpisodes(s, moved(s.episodes, i, i - 1)) }, "↑");
    const down = h("button", { class: "arrow", title: "Descendre", disabled: i === last,
      onclick: () => reorderEpisodes(s, moved(s.episodes, i, i + 1)) }, "↓");
    const handle = h("td", { class: "handle", title: "Glisser pour déplacer" }, "⋮⋮");

    const tr = h("tr", {},
      handle,
      h("td", { class: "n" }, e.number),
      h("td", {}, name),
      h("td", { class: "meta" }, [fmtDur(e.duration_s), fmtSize(e.size_bytes)].filter(Boolean).join(" · ")),
      h("td", { class: "meta" }, up, down, syn, del),
    );

    // Glisser-déposer : on ne rend la ligne déplaçable que depuis la poignée (le champ nom reste éditable).
    handle.onmousedown = () => (tr.draggable = true);
    tr.onmouseup = () => (tr.draggable = false);
    tr.ondragstart = (ev) => { dragged = { season: s, episode: e }; tr.classList.add("dragging"); ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", e.id); };
    tr.ondragend = () => { tr.draggable = false; tr.classList.remove("dragging"); dragged = null; };
    const side = (ev) => { const r = tr.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2 ? "top" : "bottom"; };
    tr.ondragover = (ev) => {
      if (!dragged || dragged.season !== s || dragged.episode === e) return;
      ev.preventDefault();
      tr.classList.toggle("over-top", side(ev) === "top");
      tr.classList.toggle("over-bottom", side(ev) === "bottom");
    };
    tr.ondragleave = () => tr.classList.remove("over-top", "over-bottom");
    tr.ondrop = (ev) => {
      ev.preventDefault();
      tr.classList.remove("over-top", "over-bottom");
      if (!dragged || dragged.season !== s || dragged.episode === e) return;
      const from = s.episodes.indexOf(dragged.episode);
      let to = s.episodes.indexOf(e) + (side(ev) === "bottom" ? 1 : 0);
      if (from < to) to--;
      if (from !== to) reorderEpisodes(s, moved(s.episodes, from, to));
    };
    return tr;
  }

  render();
  return card;
}

sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") showLogin(); });
boot();
</script>
