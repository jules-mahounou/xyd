        img.append(h("video", { src: a.video_url, poster: a.image_url || null, autoplay: true, muted: true, loop: true, playsinline: true,
          style: { width: "100%", height: "100%", objectFit: "cover", display: "block" } }));
        img.querySelector("video").muted = true;
      } else if (!a.image_url) {
        img.textContent = "Média " + (AD_RATIOS[f.ratio.value] || "") + "\nimage, GIF ou vidéo MP4 (12 Mo max)\nclique ou glisse un fichier";
      }
      if (a.image_url) img.append(overlayPreview());
    };
    // Aperçu du texte tel que l'app l'écrit sur le média (même logique de position / couleur).
    const overlayPreview = () => {
      const title = f.title.value.trim(), desc = f.description.value.trim(), cta = f.cta.value.trim();
      if (!f.showText.checked || !(title || desc || cta)) return "";
      const tall = f.ratio.value === "portrait" || f.ratio.value === "square";
      const pos = f.position.value, light = f.theme.value === "light";
      const ink = light ? "#fff" : "#1b1408";
      const veil = !light ? "none" : tall ? "linear-gradient(180deg,transparent 35%,rgba(0,0,0,.78))"
        : pos === "right" ? "linear-gradient(90deg,transparent 35%,rgba(0,0,0,.69))"
        : pos === "center" ? "linear-gradient(180deg,rgba(0,0,0,.19),rgba(0,0,0,.56))" : "linear-gradient(90deg,rgba(0,0,0,.69),transparent 65%)";
      const align = pos === "center" ? "center" : pos === "right" ? "flex-end" : "flex-start";
      return h("div", { class: "ad-ov", style: { background: veil, justifyContent: tall ? "flex-end" : "center", alignItems: align, textAlign: pos === "center" ? "center" : pos === "right" ? "right" : "left", color: ink, pointerEvents: "none" } },
        h("div", { style: { maxWidth: tall || pos === "center" ? "100%" : "66%", display: "flex", flexDirection: "column", alignItems: align } },
          title ? h("b", { style: { fontSize: "1.1em" } }, title) : "",
          desc ? h("span", { style: { opacity: .82, fontSize: ".82em", marginTop: ".2em" } }, desc) : "",
          cta ? h("span", { class: "ad-cta", style: { background: light ? "#fff" : "#1b1408", color: light ? "#111" : "#fff4dc" } }, cta) : ""));
    };
    for (const el of [f.title, f.description, f.cta]) el.addEventListener("input", showImg);
    for (const el of [f.showText, f.position, f.theme]) el.addEventListener("change", showImg);
    f.ratio.onchange = showImg;
    const setImg = async (file) => {
      if (!file) return;
      const isGif = file.type === "image/gif", isVideo = file.type === "video/mp4";
      if (!isGif && !isVideo && !/^image\//.test(file.type)) return toast("Format non pris en charge : image, GIF ou vidéo MP4", 4000, "e");
      if ((isGif || isVideo) && file.size > AD_MAX_BYTES) return toast(`Fichier trop lourd (${fmtSize(file.size)}) : 12 Mo maximum`, 5000, "e");
      if (isVideo) {
        const d = await probeDuration(file);
        if (d > 60 && !(await uiConfirm(`Cette vidéo dure ${fmtDur(d)}. Pour une annonce, quelques secondes en boucle suffisent (et chargent plus vite). Continuer quand même ?`, { ok: "Continuer" }))) return;
      }
      img.replaceChildren(); img.style.backgroundImage = ""; img.textContent = "Envoi…";
      try {
        if (isVideo) {
          const thumb = await videoThumb(file);
          const [poster, video] = await Promise.all([uploadImage(thumb, a.id, "ad"), uploadAdFile(file, a.id, "mp4")]);
          Object.assign(a, { media_type: "video", image_url: poster, video_url: video });
          a.layout = { ...(a.layout || {}), aspect: await measureAspect(video, true) };
        } else if (isGif) {
          Object.assign(a, { media_type: "gif", image_url: await uploadAdFile(file, a.id, "gif"), video_url: null });
          a.layout = { ...(a.layout || {}), aspect: await measureAspect(a.image_url) };
        } else {
          Object.assign(a, { media_type: "image", image_url: await uploadImage(file, a.id, "ad"), video_url: null });
          a.layout = { ...(a.layout || {}), aspect: await measureAspect(a.image_url) };
        }
        showImg();
      } catch (e) { showImg(); fail(e); }
    };
    img.onclick = async () => setImg((await pickFiles("image/*,video/mp4"))[0]);
    img.ondragover = (e) => { e.preventDefault(); img.style.borderColor = "var(--grey)"; };
    img.ondragleave = () => (img.style.borderColor = "");
    img.ondrop = (e) => { e.preventDefault(); img.style.borderColor = ""; setImg(e.dataTransfer.files[0]); };
    showImg();

    const save = h("button", { onclick: async () => {
      err.textContent = "";
      const link = f.link.value.trim();
      if (link && !/^https?:\/\/\S+\.\S+/.test(link)) return (err.textContent = "Lien invalide : il doit commencer par https://");
      if (!a.image_url) return (err.textContent = "Ajoute un média (image, GIF ou vidéo).");
      const row = { title: f.title.value.trim(), description: f.description.value.trim(), link_url: link || null,
        ratio: f.ratio.value, image_url: a.image_url, published: f.published.checked,
        media_type: a.media_type || "image", video_url: a.media_type === "video" ? a.video_url : null,
        layout: { showText: f.showText.checked, position: f.position.value, theme: f.theme.value, cta: f.cta.value.trim(),
          // Proportions réelles (format libre) ; mesurées ici si l'annonce date d'avant ce réglage.
          aspect: a.layout?.aspect || await measureAspect(a.media_type === "video" ? a.video_url : a.image_url, a.media_type === "video") } };
      save.disabled = true;
      const res = a._new
        ? await sb.from("announcements").insert({ id: a.id, ...row }).select("*").single()
        : await sb.from("announcements").update(row).eq("id", a.id).select("*").single();
      save.disabled = false;
      if (res.error) return (err.textContent = res.error.message);
      const i = ads.findIndex((x) => x.id === a.id);
      i >= 0 ? (ads[i] = res.data) : ads.unshift(res.data);
      // média remplacé : l'ancien fichier (et ceux envoyés puis abandonnés) est effacé
      pruneMedia(a.id, [res.data.image_url, res.data.video_url]);
      editing = { ...res.data };
      toast(a._new ? "Annonce créée — place-la dans une section" : "Annonce enregistrée");
      renderNav(); render();
    } }, icon("save"), a._new ? "Créer l'annonce" : "Enregistrer");

    const del = !a._new && h("button", { class: "danger", onclick: async () => {
      if (!(await uiConfirm(`Supprimer l'annonce « ${a.title || "sans titre"} » ? Elle disparaît de toutes les sections et son média est effacé du stockage.`, { ok: "Supprimer", danger: true }))) return;
      const { error } = await sb.from("announcements").delete().eq("id", a.id);
      if (error) return fail(error);
      pruneMedia(a.id);
      ads = ads.filter((x) => x.id !== a.id);
      for (const c of categories) c.items = c.items.filter((k) => k !== "a:" + a.id);
      editing = null; toast("Annonce supprimée"); renderNav(); render();
    } }, icon("trash"), "Supprimer");

    return h("div", { class: "card", style: { marginBottom: "16px" } },
      h("div", { class: "ptitle" }, h("h3", {}, a._new ? "Nouvelle annonce" : "Modifier l'annonce"),
        h("button", { class: "icon", title: "Fermer", onclick: () => { editing = null; render(); } }, icon("x"))),
      h("div", { class: "cols", style: { marginTop: 0 } },
        h("div", {},
          h("label", { style: { marginTop: 0 } }, "Format du visuel"), f.ratio,
          h("label", {}, "Média"), img,
          h("p", { class: "muted", style: { fontSize: "12px", marginTop: "6px" } },
            "Image, GIF animé ou courte vidéo MP4 (12 Mo max ; jouée en boucle, sans son). Tout le média est cliquable dans l'app quand il y a un lien."),
        ),
        h("div", {},
          h("label", { style: { marginTop: 0 } }, "Titre (facultatif)"), f.title,
          h("label", {}, "Description (facultatif)"), f.description,
          h("label", {}, "Lien (facultatif)"), f.link,
          h("label", {}, "Bouton (facultatif)"), f.cta,
          h("div", { class: "sform" },
            h("label", { class: "check", style: { display: "flex" } }, f.showText, "Écrire le titre, la description et le bouton sur le média"),
            h("p", { class: "muted", style: { fontSize: "12px", margin: "4px 0 0" } },
              "Décoche si le visuel contient déjà son texte : le titre ne sert alors qu'à le retrouver ici. Champs vides = rien d'écrit."),
            h("div", { class: "grid2" },
              h("div", {}, h("label", {}, "Position du texte"), f.position),
              h("div", {}, h("label", {}, "Couleur du texte"), f.theme)),
          ),
          h("label", { class: "check", style: { display: "flex", marginTop: "14px" } }, f.published, "Visible dans l'app"),
          a._new ? h("p", { class: "muted", style: { fontSize: "12px", marginTop: "12px" } }, "Les sections se choisissent après la création.")
            : h("div", {}, h("label", {}, "Sections"), titleCategoryChips({ id: "a:" + a.id }, "a:" + a.id)),
        ),
      ),
      h("div", { class: "row", style: { marginTop: "16px" } }, save, h("span", { style: { flex: 1 } }), err, del || ""),
    );
  }

  render();
  return card;
}

// ---------------------------------------------------------------- catégories
const titleById = (id) => titles.find((t) => t.id === id);
const moveIn = (arr, from, to) => { const a = arr.slice(); const [x] = a.splice(from, 1); a.splice(to, 0, x); return a; };

const isAdKey = (k) => typeof k === "string" && k.startsWith("a:");
const adById = (id) => ads.find((a) => a.id === id);
/** Élément d'une section : { kind: "titre" | "annonce", name, thumb, sub } (ou null s'il n'existe plus). */
function itemOf(k) {
  if (isAdKey(k)) {
    const a = adById(k.slice(2));
    return a && { kind: "annonce", name: a.title || "Annonce sans titre", thumb: a.image_url, sub: "annonce · " + (AD_RATIOS[a.ratio] || a.ratio).toLowerCase() };
  }
  const t = titleById(k);
  return t && { kind: "titre", name: t.name, thumb: t.poster_url, sub: t.kind === "film" ? "film" : "série" };
}

async function setCategoryTitles(c, ids) {
  // Section mélangée (annonces) : RPC qui renumérote les deux tables ; sinon l'ancienne RPC.
  const { error } = adsAvailable
    ? await sb.rpc("reorder_category_items", { p_category: c.id, p_keys: ids })
    : await sb.rpc("reorder_category_titles", { p_category: c.id, p_title_ids: ids });
  if (error) throw error;
  c.items = ids;
}

/** Ajout : le dernier titre ajouté passe en premier dans la section (comme dans l'app). */
async function addToCategory(c, titleId) {
  const { error } = isAdKey(titleId)
    ? await sb.from("announcement_categories").insert({ category_id: c.id, announcement_id: titleId.slice(2), position: 0 })
    : await sb.from("title_categories").insert({ category_id: c.id, title_id: titleId, position: 0 });
  if (error) throw error;
  c.items = [titleId, ...c.items];
  await setCategoryTitles(c, c.items); // renumérote 1, 2, 3… avec le nouveau en tête
}

async function removeFromCategory(c, titleId) {
  const { error } = isAdKey(titleId)
    ? await sb.from("announcement_categories").delete().eq("category_id", c.id).eq("announcement_id", titleId.slice(2))
    : await sb.from("title_categories").delete().eq("category_id", c.id).eq("title_id", titleId);
  if (error) throw error;
  c.items = c.items.filter((x) => x !== titleId);
}

/** Pastilles cliquables dans la fiche d'un titre : ajoute / retire de chaque catégorie. */
function titleCategoryChips(t, key = t.id) {
  const box = h("div", { class: "row", style: { gap: "6px" } });
  const render = () => box.replaceChildren(...categories.map((c) => {
    const on = c.items.includes(key);
    return h("button", { class: "chip" + (on ? " on" : ""), onclick: async () => {
      try {
        on ? await removeFromCategory(c, key) : await addToCategory(c, key);
        render();
      } catch (e) { fail(e); }
    } }, (on ? "✓ " : "+ ") + c.name);
  }));
  render();
  return box;
}

const openCats = new Set();

const AUTO_LABEL = { series: "toutes les séries", films: "tous les films" };

/**
 * Les rangées « Séries » et « Films » que l'app ajoutait d'office deviennent des sections automatiques :
 * déplaçables, renommables, stylables. Créées une fois, en fin de liste (même ordre qu'avant).
 */
async function ensureAutoCategories() {
  if (!categories.length || !categories[0].hasStyle) return;
  for (const [auto, name] of [["series", "Séries"], ["films", "Films"]]) {
    if (categories.some((c) => c.style?.auto === auto)) continue;
    const sort = Math.max(0, ...categories.map((c) => c.sort)) + 1;
    const { data, error } = await sb.from("categories").insert({ name, sort, style: { auto } }).select("*").single();
    if (error) return console.warn(error);
    categories.push({ id: data.id, name: data.name, sort: data.sort, ranked: data.ranked, style: data.style || {}, hasStyle: true, items: [] });
  }
}

/** Gestion des catégories (rangées de l'accueil). */
function categoriesCard() {
  const card = h("div", { class: "card" });
  ensureAutoCategories().then(() => render());
  const render = () => {
    card.replaceChildren(
      h("div", { class: "toolbar" },
        h("span", { class: "count" }, plural(categories.length, "catégorie")),
        h("span", { class: "sp" }),
        h("button", { class: "sm", onclick: addCategory }, icon("plus"), "Catégorie"),
      ),
      categories.length ? "" : h("div", { class: "empty" }, icon("tag"), h("div", {}, "Aucune catégorie.")),
      h("div", {}, ...categories.map((c, i) => catBlock(c, i))),
    );
  };

  async function addCategory() {
    const name = await uiPrompt("Nouvelle catégorie", "", { placeholder: "ex : Top 10, Anime, Nouveautés…", ok: "Créer" });
    if (!name?.trim()) return;
    const sort = Math.max(0, ...categories.map((c) => c.sort)) + 1;
    const { data, error } = await sb.from("categories").insert({ name: name.trim(), sort }).select("*").single();
    if (error) return fail(error);
    categories.push({ id: data.id, name: data.name, sort: data.sort, ranked: data.ranked, style: data.style || {}, hasStyle: "style" in data, items: [] });
    openCats.add(data.id);
    render();
  }

  async function reorder(list) {
    const { error } = await sb.rpc("reorder_categories", { p_ids: list.map((c) => c.id) });
    if (error) return fail(error);
    list.forEach((c, i) => (c.sort = i + 1));
    categories = list;
    render();
  }

  function catBlock(c, i) {
    const name = h("input", { type: "text", value: c.name });
    name.onchange = async () => {
      const v = name.value.trim();
      if (!v) return (name.value = c.name);
      const { error } = await sb.from("categories").update({ name: v }).eq("id", c.id);
      error ? fail(error) : (c.name = v, toast("Catégorie renommée"));
    };
    const ranked = h("input", { type: "checkbox", checked: c.ranked });
    ranked.onchange = async () => {
      const { error } = await sb.from("categories").update({ ranked: ranked.checked }).eq("id", c.id);
      error ? (fail(error), (ranked.checked = c.ranked)) : (c.ranked = ranked.checked, toast(c.ranked ? "Affichage classement activé" : "Affichage classement désactivé"));
    };
    const open = openCats.has(c.id);
    const block = h("div", { class: "cat" },
      h("div", { class: "row" },
        h("span", { class: "dim", style: { width: "20px", fontWeight: 700 } }, i + 1),
        name,
        h("label", { class: "check", title: "Grands numéros 1, 2, 3… comme un Top 10" }, ranked, "Classement"),
        c.style?.auto ? h("span", { class: "pill", title: "Contenu automatique, mis à jour tout seul" }, "auto · " + AUTO_LABEL[c.style.auto])
          : h("span", { class: "muted", style: { fontSize: "13px" } }, plural(c.items.length, "élément")),
        h("span", { style: { flex: 1 } }),
        h("button", { class: "arrow", title: "Monter", disabled: i === 0, onclick: () => reorder(moveIn(categories, i, i - 1)) }, "↑"),
        h("button", { class: "arrow", title: "Descendre", disabled: i === categories.length - 1, onclick: () => reorder(moveIn(categories, i, i + 1)) }, "↓"),
        h("button", { class: "ghost sm", onclick: () => { open ? openCats.delete(c.id) : openCats.add(c.id); render(); } }, open ? "Fermer" : "Gérer"),
        c.style?.auto ? "" : h("button", { class: "icon", title: "Supprimer la catégorie", onclick: async () => {
          if (!(await uiConfirm(`Supprimer la catégorie « ${c.name} » ? Les titres ne sont pas supprimés.`, { ok: "Supprimer", danger: true }))) return;
          const { error } = await sb.from("categories").delete().eq("id", c.id);
          if (error) return fail(error);
          categories = categories.filter((x) => x !== c);
          render();
        } }, icon("trash")),
      ),
      open ? catTitles(c) : "",
    );
    return block;
  }

  // Styles disponibles (le JSON categories.style accepte d'autres clés plus tard sans migration).
  const CARD_STYLES = [["poster", "Affiches (classique)"], ["accordion", "Accordéon paysage"], ["warp", "Carrousel incurvé"], ["halo", "Halo animé (bêta)"], ["zoom", "Zoom en escalier (bêta)"]];
  const SECTION_STYLES = [["row", "Rangée horizontale"], ["banner", "Bannière pleine largeur"]];
  const NUMBER_POSITIONS = [["bottom-start", "En bas à gauche"], ["top-start", "En haut à gauche"], ["bottom-end", "En bas à droite"], ["top-end", "En haut à droite"]];

  async function saveStyle(c, patch) {
    const style = { ...(c.style || {}), ...patch };
    const { error } = await sb.from("categories").update({ style }).eq("id", c.id);
    if (error) return fail(error);
    c.style = style;
    toast("Style enregistré");
    render();
  }

  function styleBox(c) {
    if (!c.hasStyle) return h("p", { class: "muted", style: { fontSize: "12px", margin: "4px 0 10px" } },
      "Styles indisponibles : la migration « category_styles » n'est pas encore appliquée (workflow Backend).");
    const sel = (opts, value, onchange, disabled) => {
      const el = h("select", { disabled }, ...opts.map(([v, l]) => h("option", { value: v, selected: v === value }, l)));
      el.onchange = () => onchange(el.value);
      return el;
    };
    const st = c.style || {};
    const card = st.card || "poster";
    const numberOk = c.ranked && card === "poster" && (st.section || "row") === "row";
    const showTitle = h("input", { type: "checkbox", checked: st.showTitle !== false });
    showTitle.onchange = () => saveStyle(c, { showTitle: showTitle.checked });
    return h("div", { style: { marginBottom: "12px" } },
      h("label", { class: "check", style: { display: "flex", marginBottom: "10px" }, title: "Décoche pour une section visuelle seule (ex. bannière d'annonce)" },
        showTitle, "Afficher le titre de la section dans l'app"),
      h("div", { class: "grid3" },
      h("div", {}, h("label", { style: { marginTop: 0 } }, "Style de section"), sel(SECTION_STYLES, st.section || "row", (v) => saveStyle(c, { section: v }))),
      h("div", {}, h("label", { style: { marginTop: 0 } }, "Style des cartes"), sel(CARD_STYLES, card, (v) => saveStyle(c, { card: v }))),
      h("div", { title: numberOk ? "" : "Actif avec « Classement » coché et le style « Affiches »" },
        h("label", { style: { marginTop: 0 } }, "Numérotation"),
        sel(NUMBER_POSITIONS, st.number?.position || "bottom-start", (v) => saveStyle(c, { number: { ...(st.number || {}), position: v } }), !numberOk)),
      ),
      (st.section || "row") === "banner" ? h("p", { class: "muted", style: { fontSize: "12px", marginTop: "6px" } },
        "Bannière : chaque élément prend toute la largeur à son format ; le style des cartes ne s'applique pas.") : "",
    );
  }

  function catTitles(c) {
    if (c.style?.auto) {
      return h("div", { class: "cat-titles sform" },
        styleBox(c),
        h("p", { class: "muted", style: { fontSize: "13px", margin: "4px 0" } },
          `Section automatique : ${AUTO_LABEL[c.style.auto]} du catalogue, dans l'ordre d'affichage du catalogue. Déplace-la avec ↑ ↓ comme les autres.`));
    }
    const items = c.items.map((k) => [k, itemOf(k)]).filter(([, it]) => it);
    // Ajout par recherche (au lieu d'une longue liste déroulante).
    const q = h("input", { type: "search", placeholder: adsAvailable ? "Ajouter un titre ou une annonce : tape son nom…" : "Ajouter un titre : tape son nom…", autocomplete: "off" });
    const results = h("div", { class: "pick" });
    const showResults = () => {
      const nq = norm(q.value).trim();
      const pool = [...ads.map((a) => "a:" + a.id), ...titles.map((t) => t.id)]
        .filter((k) => !c.items.includes(k)).map((k) => [k, itemOf(k)]).filter(([, it]) => it && (!nq || norm(it.name).includes(nq)));
      const others = pool.slice(0, 8);
      results.replaceChildren(...(nq || document.activeElement === q ? others : []).map(([k, it]) => h("button", { type: "button", class: "pick-it", onmousedown: (e) => e.preventDefault(), onclick: async () => {
        try { await addToCategory(c, k); toast(`« ${it.name} » ajouté en premier`); render(); } catch (e) { fail(e); }
      } },
        h("div", { class: "thumb", style: Object.assign({ width: "22px" }, it.thumb ? { backgroundImage: `url("${it.thumb}")` } : {}) }),
        h("span", { style: { flex: 1 } }, it.name), h("span", { class: it.kind === "annonce" ? "pill feat" : "muted", style: { fontSize: "12px" } }, it.sub))));
      if (nq && !others.length) results.replaceChildren(h("div", { class: "muted", style: { padding: "8px", fontSize: "13px" } }, "Aucun titre trouvé (ou déjà dans la section)."));
    };
    q.oninput = showResults; q.onfocus = showResults;
    q.onblur = () => setTimeout(() => results.replaceChildren(), 150);
    q.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); results.querySelector(".pick-it")?.click(); } };

    // Réordonner : glisser la poignée ⋮⋮ (un seul enregistrement à la fin), ou « en premier ».
    let dragged = null;
    const move = async (from, to) => {
      if (from === to) return;
      try { await setCategoryTitles(c, moveIn(c.items, from, to)); render(); } catch (e) { fail(e); }
    };
    const list = h("div", {}, ...items.map(([key, it], j) => {
      const idx = c.items.indexOf(key);
      const t = { id: key, name: it.name };
      const handle = h("span", { class: "handle", title: "Glisser pour déplacer" }, "⋮⋮");
      const row = h("div", { class: "it" },
        handle,
        h("span", { class: "rk" }, c.ranked ? `${j + 1}` : "•"),
        h("div", { class: "thumb", style: Object.assign({ width: "24px" }, it.thumb ? { backgroundImage: `url("${it.thumb}")` } : {}) }),
        h("span", { style: { flex: 1 } }, it.name, " ", h("span", { class: it.kind === "annonce" ? "pill feat" : "muted", style: { fontSize: "12px" } }, it.sub)),
        h("button", { class: "arrow", title: "Mettre en premier", disabled: j === 0, onclick: () => move(idx, 0) }, "⤒"),
        h("button", { class: "arrow", title: "Monter", disabled: j === 0, onclick: () => move(idx, idx - 1) }, "↑"),
        h("button", { class: "arrow", title: "Descendre", disabled: j === items.length - 1, onclick: () => move(idx, idx + 1) }, "↓"),
        h("button", { class: "arrow", title: "Retirer de la section", onclick: async () => {
          if (!(await uiConfirm(`Retirer « ${t.name} » de « ${c.name} » ? Le titre n'est pas supprimé.`, { ok: "Retirer" }))) return;
          try { await removeFromCategory(c, t.id); render(); } catch (e) { fail(e); }
        } }, "✕"),
      );
      handle.onmousedown = () => (row.draggable = true);
      row.onmouseup = () => (row.draggable = false);
      row.ondragstart = (ev) => { dragged = idx; row.classList.add("dragging"); ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", t.id); };
      row.ondragend = () => { row.draggable = false; row.classList.remove("dragging"); dragged = null; };
      const side = (ev) => { const r = row.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2 ? "top" : "bottom"; };
      row.ondragover = (ev) => { if (dragged === null || dragged === idx) return; ev.preventDefault(); row.classList.toggle("over-top", side(ev) === "top"); row.classList.toggle("over-bottom", side(ev) === "bottom"); };
      row.ondragleave = () => row.classList.remove("over-top", "over-bottom");
      row.ondrop = (ev) => {
        ev.preventDefault(); row.classList.remove("over-top", "over-bottom");
        if (dragged === null || dragged === idx) return;
        let to = idx + (side(ev) === "bottom" ? 1 : 0);
        if (dragged < to) to--;
        move(dragged, to);
      };
      return row;
    }));

    return h("div", { class: "cat-titles sform" },
      styleBox(c),
      h("div", { class: "pickbox" }, q, results),
      h("p", { class: "muted", style: { fontSize: "12px", margin: "8px 0 4px" } },
        "Un titre ajouté arrive en premier dans l'app. Glisse ⋮⋮ pour réordonner, ou ⤒ pour le mettre en tête."),
      items.length ? list : h("div", { class: "muted", style: { padding: "10px 0", fontSize: "13px" } }, "Rien dans cette section."),
    );
  }

  render();
  return card;
}

// ---------------------------------------------------------------- saisons & épisodes
function seasonsCard(t) {
  const card = h("div", { class: "card" });
  const render = () => {
    const eps = t.seasons.reduce((a, s) => a + s.episodes.length, 0);
    card.replaceChildren(
      h("div", { class: "ptitle", style: { marginBottom: 0 } },
        h("h3", {}, "Saisons & épisodes"),
        h("span", { class: "count" }, `${plural(t.seasons.length, "saison")} · ${plural(eps, "épisode")}`),
        h("button", { class: "ghost sm", onclick: addSeason }, icon("plus"), "Saison"),
      ),
      t.seasons.length ? "" : h("div", { class: "empty" }, icon("tv"), h("div", {}, "Ajoute une première saison, puis glisse les vidéos des épisodes.")),
      ...t.seasons.map((s, si) => seasonBlock(s, si)),
    );
  };

  // Renumérotation atomique côté base (contraintes d'unicité différées).
  async function reorderEpisodes(s, list) {
    if (uploading) return toast("Attends la fin des envois pour réordonner");
    const { error } = await sb.rpc("reorder_episodes", { p_season: s.id, p_ids: list.map((e) => e.id) });
    if (error) return fail(error);
    list.forEach((e, i) => (e.number = i + 1));
    s.episodes = list;
    render();
  }

  async function reorderSeasons(list) {
    if (uploading) return toast("Attends la fin des envois pour réordonner");
    const { error } = await sb.rpc("reorder_seasons", { p_title: t.id, p_ids: list.map((x) => x.id) });
    if (error) return fail(error);
    list.forEach((x, i) => (x.number = i + 1));
    t.seasons = list;
    render();
  }

  const moved = (arr, from, to) => { const a = arr.slice(); const [x] = a.splice(from, 1); a.splice(to, 0, x); return a; };
  let dragged = null; // { season, episode }

  let adding = false;
  async function addSeason(ev) {
    if (adding) return;
    adding = true;
    if (ev?.currentTarget) ev.currentTarget.disabled = true;
    const number = Math.max(0, ...t.seasons.map((s) => s.number)) + 1;
    const { data, error } = await sb.from("seasons").insert({ title_id: t.id, number, name: `Saison ${number}` }).select("*").single();
    adding = false;
    if (error) { render(); return fail(error); }
    data.episodes = [];
    t.seasons.push(data);
    render();
  }

  function seasonBlock(s, si) {
    const nameInput = h("input", { type: "text", value: s.name });
    nameInput.onchange = async () => {
      const { error } = await sb.from("seasons").update({ name: nameInput.value.trim() }).eq("id", s.id);
      error ? fail(error) : (s.name = nameInput.value.trim(), toast("Saison renommée"));
    };
    const tbody = h("tbody");
    const sum = h("span", { class: "count" });
    const renderEps = () => {
      tbody.replaceChildren(...s.episodes.map((e) => episodeRow(s, e, renderEps)));
      const real = s.episodes.filter((e) => !e._pending);
      sum.textContent = [plural(real.length, "épisode"), fmtDur(real.reduce((a, e) => a + (e.duration_s || 0), 0)), fmtSize(real.reduce((a, e) => a + (e.size_bytes || 0), 0))].filter(Boolean).join(" · ");
    };
    renderEps();

    const addEpisodes = async (files) => {
      files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      if (!(await confirmPlan(files))) return;
      // Les envois partent l'un après l'autre ; chaque épisode est créé dès que sa vidéo est en ligne.
      for (const file of files) {
        const number = Math.max(0, ...s.episodes.map((e) => e.number)) + 1;
        const key = `series/${slug(t.name)}-${t.id.slice(0, 8)}/s${pad(s.number)}/e${pad(number)}-${rand()}.${extOf(file)}`;
        try {
          const duration = await probeDuration(file);
          // Réserve le numéro pendant l'envoi pour que les fichiers suivants prennent les numéros d'après.
          const placeholder = { number, name: "…", _pending: true };
          s.episodes.push(placeholder);
          renderEps();
          let storageId;
          try {
            storageId = await uploadToStore(file, key, `${t.name} · S${pad(s.number)}E${pad(number)}`);
          } finally {
            s.episodes = s.episodes.filter((x) => x !== placeholder);
          }
          const { data, error } = await sb.from("episodes").insert({
            season_id: s.id, number, name: nameFromFile(file) || `Épisode ${number}`,
            video_key: key, storage_id: storageId, duration_s: duration, size_bytes: file.size,
          }).select("*").single();
          if (error) { storeDelete([{ key, storage_id: storageId, size: file.size }]); throw error; }
          s.episodes.push(data);
          s.episodes.sort((a, b) => a.number - b.number);
          renderEps();
        } catch (e) { fail(e); renderEps(); }
      }
    };

    const del = h("button", { class: "icon", title: "Supprimer la saison", onclick: async () => {
      if (!(await uiConfirm(`Supprimer ${s.name || "la saison " + s.number} et ses ${s.episodes.length} épisodes ? Les vidéos seront effacées du stockage.`, { title: "Supprimer la saison", ok: "Supprimer", danger: true }))) return;
      const { error } = await sb.from("seasons").delete().eq("id", s.id);
      if (error) return fail(error);
      storeDelete(s.episodes.map(videoOf));
      t.seasons = t.seasons.filter((x) => x !== s);
      render();
    } }, icon("trash"));

    return h("div", { class: "season" },
      h("div", { class: "shead" }, h("span", { class: "snum" }, `S${pad(s.number)}`), nameInput, sum, h("span", { style: { flex: 1 } }),
        h("button", { class: "arrow", title: "Monter la saison", disabled: si === 0,
          onclick: () => reorderSeasons(moved(t.seasons, si, si - 1)) }, "↑"),
        h("button", { class: "arrow", title: "Descendre la saison", disabled: si === t.seasons.length - 1,
          onclick: () => reorderSeasons(moved(t.seasons, si, si + 1)) }, "↓"),
        del),
      h("table", {}, tbody),
      h("div", { style: { marginTop: "10px" } },
        dropZone("Glisse les vidéos des épisodes ici (plusieurs à la fois) ou clique pour choisir", addEpisodes, true)),
    );
  }

  function episodeRow(s, e, rerender) {
    if (e._pending) return h("tr", {}, h("td", {}), h("td", { class: "n" }, e.number), h("td", { class: "muted", colspan: 3 }, "envoi en cours…"));
    const name = h("input", { type: "text", value: e.name });
    name.onchange = async () => {
      const { error } = await sb.from("episodes").update({ name: name.value.trim() }).eq("id", e.id);
      error ? fail(error) : (e.name = name.value.trim(), toast("Épisode renommé"));
    };
    const syn = h("button", { class: "link", title: "Résumé de l'épisode", style: e.synopsis ? {} : { color: "#f2c25c" }, onclick: async () => {
      const v = await uiPrompt(`Résumé · épisode ${e.number}`, e.synopsis || "", { type: "textarea", text: e.name });
      if (v == null) return;
      const { error } = await sb.from("episodes").update({ synopsis: v.trim() }).eq("id", e.id);
      error ? fail(error) : (e.synopsis = v.trim(), toast("Résumé enregistré"), rerender());
    } }, e.synopsis ? "✎ résumé" : "+ résumé");
    const del = h("button", { class: "arrow", title: "Supprimer l'épisode", onclick: async () => {
      if (!(await uiConfirm(`Supprimer l'épisode ${e.number} « ${e.name} » ? La vidéo sera effacée du stockage.`, { ok: "Supprimer", danger: true }))) return;
      const { error } = await sb.from("episodes").delete().eq("id", e.id);
      if (error) return fail(error);
      storeDelete([videoOf(e)]);
      s.episodes = s.episodes.filter((x) => x !== e);
      rerender();
    } }, "✕");
    const i = s.episodes.indexOf(e);
    const last = s.episodes.length - 1;
    const up = h("button", { class: "arrow", title: "Monter", disabled: i === 0,
      onclick: () => reorderEpisodes(s, moved(s.episodes, i, i - 1)) }, "↑");
    const down = h("button", { class: "arrow", title: "Descendre", disabled: i === last,
      onclick: () => reorderEpisodes(s, moved(s.episodes, i, i + 1)) }, "↓");
    const handle = h("td", { class: "handle", title: "Glisser pour déplacer" }, "⋮⋮");

    const tr = h("tr", {},
      handle,
      h("td", { class: "n" }, e.number),
      h("td", {}, name),
      h("td", { class: "meta" }, [fmtDur(e.duration_s), fmtSize(e.size_bytes)].filter(Boolean).join(" · ")),
      h("td", { class: "meta" }, up, down, syn, del),
    );

    // Glisser-déposer : on ne rend la ligne déplaçable que depuis la poignée (le champ nom reste éditable).
    handle.onmousedown = () => (tr.draggable = true);
    tr.onmouseup = () => (tr.draggable = false);
    tr.ondragstart = (ev) => { dragged = { season: s, episode: e }; tr.classList.add("dragging"); ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", e.id); };
    tr.ondragend = () => { tr.draggable = false; tr.classList.remove("dragging"); dragged = null; };
    const side = (ev) => { const r = tr.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2 ? "top" : "bottom"; };
    tr.ondragover = (ev) => {
      if (!dragged || dragged.season !== s || dragged.episode === e) return;
      ev.preventDefault();
      tr.classList.toggle("over-top", side(ev) === "top");
      tr.classList.toggle("over-bottom", side(ev) === "bottom");
    };
    tr.ondragleave = () => tr.classList.remove("over-top", "over-bottom");
    tr.ondrop = (ev) => {
      ev.preventDefault();
      tr.classList.remove("over-top", "over-bottom");
      if (!dragged || dragged.season !== s || dragged.episode === e) return;
      const from = s.episodes.indexOf(dragged.episode);
      let to = s.episodes.indexOf(e) + (side(ev) === "bottom" ? 1 : 0);
      if (from < to) to--;
      if (from !== to) reorderEpisodes(s, moved(s.episodes, from, to));
    };
    return tr;
  }

  render();
  return card;
}

sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") showLogin(); });
boot();
</script>
