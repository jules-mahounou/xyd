<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xyd · admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<style>
  :root {
    --bg:#000; --side:#070707; --grey:#c6c6c6; --text:#ededed; --muted:#8c8c8c; --dim:#5c5c5c;
    --card:#0c0c0c; --card2:#141414; --hover:#1a1a1a; --line:#222; --line2:#2e2e2e;
    --danger:#e5484d; --ok:#46a758; --warn:#f5a524; --info:#5b9cf5;
    --r:12px; --sidew:236px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); }
  body { font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  ::selection { background:#3a3a3a; }
  a { color:inherit; text-decoration:none; }
  h2 { font-size:20px; letter-spacing:-.01em; }
  h3 { font-size:15px; letter-spacing:-.005em; }
  .ic { display:inline-grid; place-items:center; width:18px; height:18px; flex:none; }
  .ic svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- champs */
  label { display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],textarea,select {
    width:100%; background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:9px;
    padding:9px 11px; font:inherit; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input:focus,textarea:focus,select:focus { border-color:var(--grey); box-shadow:0 0 0 3px rgba(198,198,198,.12); }
  textarea { min-height:110px; resize:vertical; }
  select { appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:30px; }
  input[type=checkbox] { accent-color:var(--grey); width:15px; height:15px; }

  /* ---------- boutons */
  button,.btn { font:inherit; font-weight:600; border:1px solid transparent; border-radius:9px; padding:8px 14px; cursor:pointer;
    background:var(--grey); color:#000; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:background .15s, border-color .15s, color .15s; }
  button:hover:not(:disabled) { background:#e0e0e0; }
  button.ghost { background:transparent; color:var(--text); border-color:var(--line2); }
  button.ghost:hover:not(:disabled) { background:var(--hover); }
  button.danger { background:transparent; color:var(--danger); border-color:#3a1d1e; }
  button.danger:hover:not(:disabled) { background:#1d0f10; }
  button.danger-solid { background:var(--danger); color:#fff; }
  button.danger-solid:hover:not(:disabled) { background:#f06368; }
  button.link { background:none; padding:5px 7px; color:var(--muted); font-weight:500; border-radius:7px; }
  button.link:hover:not(:disabled) { color:var(--text); background:var(--hover); }
  button.icon { background:none; padding:6px; color:var(--muted); border-radius:8px; }
  button.icon:hover:not(:disabled) { color:var(--text); background:var(--hover); }
  button.sm { padding:5px 10px; font-size:13px; }
  button:disabled { opacity:.4; cursor:default; }
  button.arrow { background:none; color:var(--muted); padding:3px 6px; font-weight:500; }
  button.arrow:hover:not(:disabled) { color:var(--text); background:var(--hover); }
  .chip { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:5px 11px; font-weight:500; font-size:13px; }
  .chip:hover:not(:disabled) { background:var(--hover); color:var(--text); }
  .chip.on { background:var(--grey); color:#000; border-color:var(--grey); }
  .chip .n { font-size:11px; opacity:.7; margin-left:2px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; padding:2px; background:var(--card); }
  .seg button { background:none; color:var(--muted); padding:5px 9px; border-radius:7px; font-weight:500; }
  .seg button.on { background:var(--hover); color:var(--text); }
  .switch { width:34px; height:20px; padding:0; border-radius:20px; background:var(--line2); position:relative; border:0; flex:none; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#777; transition:transform .15s, background .15s; }
  .switch.on { background:var(--ok); }
  .switch.on::after { transform:translateX(14px); background:#fff; }
  .switch:hover:not(:disabled) { background:#3a3a3a; } .switch.on:hover:not(:disabled) { background:#55b866; }
  .star { background:none; padding:4px; color:var(--dim); border:0; }
  .star.on { color:var(--warn); } .star.on svg { fill:currentColor; }
  .star:hover:not(:disabled) { background:var(--hover); color:var(--warn); }

  /* ---------- structure */
  .app { display:grid; grid-template-columns:var(--sidew) 1fr; min-height:100vh; }
  aside { position:sticky; top:0; height:100vh; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:14px 10px; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 16px; }
  .brand svg { width:26px; height:26px; }
  .brand b { font-size:16px; } .brand span { color:var(--muted); font-size:12px; border:1px solid var(--line); border-radius:6px; padding:0 6px; }
  .navsec { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); padding:14px 10px 6px; font-weight:600; }
  nav a { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; color:var(--muted); font-weight:500; margin:1px 0; }
  nav a:hover { background:var(--hover); color:var(--text); }
  nav a.on { background:var(--card2); color:var(--text); box-shadow:inset 0 0 0 1px var(--line); }
  nav a .cnt { margin-left:auto; font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px; background:var(--line); color:var(--grey); }
  nav a .cnt.hot { background:#3b311c; color:#f2c25c; }
  nav a .cnt.bad { background:#3a1d1e; color:#ff8a8d; }
  .side-foot { margin-top:auto; border-top:1px solid var(--line); padding:12px 8px 0; display:flex; align-items:center; gap:8px; }
  .avatar { width:30px; height:30px; border-radius:50%; background:var(--line2); display:grid; place-items:center; font-weight:700; font-size:13px; color:var(--grey); flex:none; }
  .side-foot .em { flex:1; min-width:0; font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .main { min-width:0; overflow-x:clip; display:flex; flex-direction:column; }
  .top { position:sticky; top:0; z-index:6; height:60px; display:flex; align-items:center; gap:12px; padding:0 24px; background:rgba(0,0,0,.82); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .top .crumbs { display:flex; align-items:center; gap:8px; min-width:0; font-weight:600; }
  .top .crumbs a { color:var(--muted); font-weight:500; } .top .crumbs a:hover { color:var(--text); }
  .top .crumbs .cur { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top .sp { flex:1; }
  .search { position:relative; width:min(340px,40vw); }
  .search .ic { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--dim); }
  .search input { padding-left:34px; height:36px; background:var(--card); }
  .search kbd { position:absolute; right:8px; top:50%; transform:translateY(-50%); }
  kbd { font:11px ui-monospace,monospace; color:var(--dim); border:1px solid var(--line2); border-radius:5px; padding:0 5px; }
  #menu { display:none; }
  .page { padding:24px; max-width:1280px; width:100%; margin:0 auto; padding-bottom:120px; }
  .phead { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .phead .t { flex:1; min-width:200px; }
  .phead p { color:var(--muted); margin-top:2px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .muted { color:var(--muted); } .dim { color:var(--dim); }
  .err { color:var(--danger); margin-top:10px; min-height:20px; font-size:13px; }
  [hidden] { display:none !important; }

  /* ---------- skeletons (chargement) */
  .sk { display:inline-block; vertical-align:middle; border-radius:6px; background:linear-gradient(90deg,#141414 25%,#212121 40%,#141414 60%); background-size:300% 100%; animation:sk 1.3s ease-in-out infinite; }
  .sk.blk { display:block; }
  @keyframes sk { from { background-position:100% 0; } to { background-position:0 0; } }
  @media (prefers-reduced-motion:reduce) { .sk { animation:none; } }
  nav a .cnt.sk { width:22px; height:16px; padding:0; }
  .tile .poster.sk { border:0; display:block; }
  .sk-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .sk-row:first-child { border-top:0; }
  .sk-row .b { flex:1; display:flex; flex-direction:column; gap:7px; }
  .ld button:not(.keep), .ld select, .ld input { pointer-events:none; opacity:.55; }

  /* ---------- cartes */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-top:16px; }
  .card:first-child { margin-top:0; }
  .card > .row:first-child > h3 { font-size:15px; }
  .ptitle { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .ptitle h3 { flex:1; }
  .sform { background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }
  .sform > b { font-size:14px; }
  .check { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--text); margin:0; font-weight:500; }
  .fields { display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; }

  /* ---------- KPI */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:4px; cursor:default; }
  a.kpi { cursor:pointer; transition:border-color .15s, background .15s; } a.kpi:hover { border-color:var(--line2); background:var(--card2); }
  .kpi .l { color:var(--muted); font-size:12px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .kpi .v { font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1.2; }
  .kpi .s { color:var(--muted); font-size:12px; }
  .kpi .meter { margin-top:6px; }
  .cols { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-top:16px; align-items:start; }
  .cols > .card { margin-top:0; }
  .stack > .card + .card { margin-top:16px; }

  /* ---------- listes */
  .li { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .li:first-child { border-top:0; }
  .li .b { flex:1; min-width:0; }
  .li .b b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .li .b small { color:var(--muted); font-size:12px; }
  a.li:hover { background:var(--hover); margin:0 -10px; padding:10px; border-radius:8px; border-top-color:transparent; }
  a.li:hover + .li { border-top-color:transparent; }
  .thumb { width:34px; aspect-ratio:2/3; border-radius:5px; background:var(--card2) center/cover no-repeat; border:1px solid var(--line); flex:none; }
  .empty { text-align:center; color:var(--muted); padding:40px 16px; }
  .empty .ic { width:34px; height:34px; color:var(--dim); margin-bottom:8px; }

  /* ---------- pastilles */
  .badge,.pill { font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--card2); border:1px solid var(--line); color:var(--grey); white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .pill.ok,.st.active,.st.done { color:#6cc77c; border-color:#1f3b25; background:#0d1a10; }
  .pill.off,.badge.off,.st.blocked { color:#ff8a8d; border-color:#3a1d1e; background:#1a0c0d; }
  .pill.warn,.st.new { color:#f2c25c; border-color:#3b311c; background:#1a150b; }
  .pill.feat { color:#f2c25c; border-color:#3b311c; }
  .st { font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; border:1px solid var(--line); white-space:nowrap; }
  .st.seen { color:var(--grey); }
  .tag { font-size:11px; padding:1px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }

  /* ---------- catalogue */
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar .sp { flex:1; }
  .toolbar select { width:auto; padding-top:6px; padding-bottom:6px; }
  .titles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px 14px; }
  .tile { cursor:pointer; min-width:0; }
  .tile .poster { aspect-ratio:2/3; border-radius:10px; background:var(--card2) center/cover no-repeat; border:1px solid var(--line); display:grid; place-items:center;
    color:var(--muted); font-weight:600; padding:8px; text-align:center; position:relative; transition:transform .15s, border-color .15s, box-shadow .15s; overflow:hidden; }
  .tile:hover .poster { transform:translateY(-2px); border-color:var(--line2); box-shadow:0 10px 30px rgba(0,0,0,.6); }
  .tile .poster.hidden-t { filter:grayscale(1) brightness(.55); }
  .tile .tl { position:absolute; top:6px; left:6px; right:6px; display:flex; gap:4px; flex-wrap:wrap; }
  .tile .tl .badge { background:rgba(0,0,0,.75); backdrop-filter:blur(4px); }
  .tile .warnb { position:absolute; bottom:6px; right:6px; background:rgba(26,21,11,.92); color:#f2c25c; border:1px solid #3b311c; border-radius:20px; font-size:11px; font-weight:700; padding:1px 7px; display:flex; align-items:center; gap:3px; }
  .tile .warnb .ic { width:12px; height:12px; }
  .tile .name { margin-top:8px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .sub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  table { width:100%; border-collapse:collapse; }
  .tbl { background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .tbl table th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--side); white-space:nowrap; }
  .tbl table td { padding:9px 12px; border-bottom:1px solid #161616; vertical-align:middle; }
  .tbl table tr:last-child td { border-bottom:0; }
  .tbl tbody tr.click { cursor:pointer; } .tbl tbody tr.click:hover td { background:#0f0f0f; }
  .tbl .nm { display:flex; align-items:center; gap:12px; min-width:220px; }
  .tbl .nm b { display:block; font-weight:600; }
  .tbl .nm small { color:var(--muted); font-size:12px; }
  .tbl td.num { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .issues { display:flex; gap:4px; flex-wrap:wrap; }
  .count { color:var(--muted); font-size:13px; }

  /* ---------- éditeur */
  .ed { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
  .ed > div > .card:first-child { margin-top:0; }
  .imgs { display:flex; gap:12px; }
  .imgbox { cursor:pointer; border:1px dashed var(--line2); border-radius:10px; background:var(--card2) center/cover no-repeat; display:grid; place-items:center; color:var(--muted); font-size:12px; text-align:center; position:relative; white-space:pre-line; transition:border-color .15s; }
  .imgbox:hover { border-color:var(--grey); }
  .imgbox.poster { width:110px; aspect-ratio:2/3; flex:none; }
  .imgbox.backdrop { flex:1; aspect-ratio:16/9; }
  .toggle-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .ptitle + .toggle-row { border-top:0; }
  .toggle-row div { flex:1; } .toggle-row small { display:block; color:var(--muted); font-size:12px; }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .facts div { background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:10px; }
  .facts b { display:block; font-size:17px; } .facts small { color:var(--muted); font-size:11px; }
  .savebar { position:sticky; bottom:16px; z-index:5; margin-top:16px; display:flex; align-items:center; gap:10px; background:rgba(16,16,16,.92); backdrop-filter:blur(10px);
    border:1px solid var(--line2); border-radius:var(--r); padding:10px 12px; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .savebar .state { flex:1; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .savebar .state.dirty { color:#f2c25c; }
  .savebar .state .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .drop { border:1px dashed var(--line2); border-radius:10px; padding:16px; text-align:center; color:var(--muted); cursor:pointer; transition:border-color .15s, background .15s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .drop:hover,.drop.over { border-color:var(--grey); background:var(--card2); color:var(--text); }
  .season { border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:12px; background:#090909; }
  .season .shead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .season .shead input { max-width:240px; padding:6px 9px; }
  .season .snum { font-weight:700; color:var(--muted); font-size:13px; min-width:34px; }
  .season table { margin-top:8px; }
  .season td { padding:5px 4px; border-bottom:1px solid #141414; vertical-align:middle; }
  .season tr:last-child td { border-bottom:0; }
  td.n { width:34px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
  td.meta { color:var(--muted); font-size:12px; white-space:nowrap; width:1%; }
  td input { padding:6px 9px; border-radius:7px; background:transparent; border-color:transparent; }
  td input:hover { border-color:var(--line); }
  td input:focus { background:var(--card2); }
  .handle { cursor:grab; color:var(--dim); user-select:none; width:22px; text-align:center; font-size:15px; }
  tr.dragging { opacity:.4; }
  tr.over-top td { box-shadow:inset 0 2px 0 var(--grey); }
  tr.over-bottom td { box-shadow:inset 0 -2px 0 var(--grey); }

  /* ---------- catégories, stockages, utilisateurs (cartes existantes) */
  .cat { border-top:1px solid var(--line); padding:12px 0; }
  .cat:first-of-type { border-top:0; }
  .cat input[type=text] { max-width:260px; padding:7px 10px; }
  .cat-titles { margin:10px 0 0 4px; }
  .cat-titles .it { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:14px; }
  .cat-titles .it .rk { width:24px; color:var(--muted); font-weight:700; }
  .cat-titles .it { border-radius:8px; }
  .cat-titles .it:hover { background:var(--hover); }
  .cat-titles .it.dragging { opacity:.4; }
  .cat-titles .it.over-top { box-shadow:inset 0 2px 0 var(--grey); }
  .cat-titles .it.over-bottom { box-shadow:inset 0 -2px 0 var(--grey); }
  .ads { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .ads .card { margin-top:0; cursor:pointer; padding:12px; transition:border-color .15s; }
  .ads .card:hover, .ads .card.on { border-color:var(--grey); }
  .ad-ov { position:absolute; inset:0; display:flex; flex-direction:column; padding:6% 7%; font-size:clamp(11px, 3.2cqw, 20px); line-height:1.25; white-space:normal; }
  .imgbox { container-type:inline-size; }
  .ad-cta { margin-top:.6em; padding:.35em .9em; border-radius:999px; font-weight:600; font-size:.85em; }
  .imgbox.free, .adimg.free { background-size:contain !important; border-radius:0; }
  .imgbox.free video { object-fit:contain !important; }
  .adimg { border-radius:10px; background:var(--card2) center/cover no-repeat; border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); font-size:12px; max-height:260px; margin:0 auto; width:100%; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:0 12px; }
  @media (max-width:820px) { .grid3 { grid-template-columns:1fr; } }
  .pickbox { position:relative; max-width:420px; }
  .pick { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:8; background:var(--card); border:1px solid var(--line2); border-radius:10px; box-shadow:0 14px 40px rgba(0,0,0,.6); overflow:hidden; }
  .pick:empty { display:none; }
  .pick-it { all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:10px; padding:7px 10px; cursor:pointer; font-size:14px; }
  .pick-it:hover, .pick-it:focus-visible { background:var(--hover); }
  .meter { height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:6px; }
  .meter i { display:block; height:100%; background:var(--grey); border-radius:6px; }
  .meter i.warn { background:var(--warn); }
  .meter i.full { background:var(--danger); }
  .store { border-top:1px solid var(--line); padding:14px 0; }

/** Redimensionne une image (JPEG) puis l'envoie dans le bucket public « posters ». */
async function uploadImage(file, titleId, kind) {
  const maxW = kind === "poster" ? 600 : kind === "ad" ? 1600 : 1280;
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxW / bmp.width);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  // Visuel d'annonce PNG / WebP : on garde la transparence (bords arrondis, éléments qui débordent).
  const keepAlpha = kind === "ad" && /^image\/(png|webp)$/.test(file.type || "");
  const type = keepAlpha ? "image/webp" : "image/jpeg";
  const blob = await new Promise((r) => c.toBlob(r, type, keepAlpha ? 0.9 : 0.85));
  const path = `${titleId}/${kind}-${Date.now()}.${keepAlpha ? "webp" : "jpg"}`;
  const { error } = await sb.storage.from("posters").upload(path, blob, { contentType: type, upsert: false });
  if (error) throw error;
  return sb.storage.from("posters").getPublicUrl(path).data.publicUrl;
}

// ---- nettoyage des médias (buckets Supabase « posters » et « ads »)
const MEDIA_BUCKETS = ["posters", "ads"];
const PUB_PREFIX = "/storage/v1/object/public/";
/** URL publique Supabase → { bucket, path } (null si ce n'est pas un de nos fichiers). */
function mediaPath(url) {
  const i = (url || "").indexOf(PUB_PREFIX);
  if (i < 0) return null;
  const [bucket, ...rest] = url.slice(i + PUB_PREFIX.length).split("?")[0].split("/");
  return MEDIA_BUCKETS.includes(bucket) && rest.length ? { bucket, path: decodeURIComponent(rest.join("/")) } : null;
}
const mediaKey = (url) => { const m = mediaPath(url); return m ? m.bucket + "/" + m.path : null; };
/** Fichiers d'un dossier <folder>/ d'un bucket (les sous-dossiers ont id = null). */
async function listFolder(bucket, folder) {
  const { data, error } = await sb.storage.from(bucket).list(folder, { limit: 1000 });
  if (error) throw error;
  return (data || []).filter((f) => f.id).map((f) => ({ ...f, path: `${folder}/${f.name}` }));
}
/**
 * Supprime tout ce qui est dans le dossier <folder>/ des buckets médias, sauf les URL de « keep ».
 * Sert à effacer l'ancien média quand on le remplace, et tout le dossier quand on supprime le titre / l'annonce.
 * Erreurs silencieuses : un fichier oublié se rattrape avec « Nettoyer les médias orphelins ».
 */
async function pruneMedia(folder, keep = []) {
  if (!folder) return;
  const kept = new Set(keep.map(mediaKey).filter(Boolean));
  for (const bucket of MEDIA_BUCKETS) {
    try {
      const paths = (await listFolder(bucket, folder)).map((f) => f.path).filter((path) => !kept.has(bucket + "/" + path));
      if (paths.length) await sb.storage.from(bucket).remove(paths);
    } catch {}
  }
}

  });
}

/** Chiffres d'un titre : épisodes, taille, durée, éléments manquants. */
function statsOf(t) {
  const eps = t.kind === "film" ? [] : t.seasons.flatMap((s) => s.episodes);
  const size = t.kind === "film" ? (t.size_bytes || 0) : eps.reduce((a, e) => a + (e.size_bytes || 0), 0);
  const dur = t.kind === "film" ? (t.duration_s || 0) : eps.reduce((a, e) => a + (e.duration_s || 0), 0);
  const issues = [];
  if (!t.poster_url) issues.push("affiche");
  if (!(t.synopsis || "").trim()) issues.push("résumé");
  if (t.kind === "film" && !t.video_key) issues.push("vidéo");
  if (t.kind === "serie" && !eps.length) issues.push("épisodes");
  return { eps: eps.length, seasons: t.seasons.length, size, dur, issues, noSyn: eps.filter((e) => !(e.synopsis || "").trim()).length };
}
const subOf = (t, s = statsOf(t)) => t.kind === "film"
  ? [t.year, fmtDur(s.dur)].filter(Boolean).join(" · ") || "Film"

async function quickToggle(t, key, rerender) {
  const v = !t[key];
  const { error } = await sb.from("titles").update({ [key]: v }).eq("id", t.id);
  if (error) return fail(error);
  t[key] = v;
  rerender();
  toast(key === "published" ? (v ? `« ${t.name} » visible dans l'app` : `« ${t.name} » masqué`) : (v ? `« ${t.name} » à la une` : `« ${t.name} » retiré de la une`));
}

    if (st === "featured" && !t.featured) return false;

      h("span", { class: "sp" }),
      count, sortSel,
      h("div", { class: "seg" },

    if (!titles.length) return body.replaceChildren(h("div", { class: "card empty" }, icon("film"), h("div", {}, "Aucun contenu. Commence par ajouter une série ou un film."),
      h("div", { class: "row", style: { justifyContent: "center", marginTop: "14px" } }, ...newBtns())));
    if (!list.length) return body.replaceChildren(h("div", { class: "card empty" }, icon("search"), h("div", {}, "Aucun titre ne correspond."),
      h("button", { class: "ghost sm", style: { marginTop: "12px" }, onclick: () => { kind = "all"; state = "all"; catQuery = ""; $("q").value = ""; setPref("cat.kind", "all"); setPref("cat.state", "all"); renderAll(); } }, "Réinitialiser les filtres")));
    if (view === "grid") return body.replaceChildren(h("div", { class: "titles" }, ...list.map(tile)));
    body.replaceChildren(h("div", { class: "tbl" }, h("table", {},
      h("thead", {}, h("tr", {}, ...["Titre", "Type", "Contenu", "Taille", "À compléter", "Visible", "Une"].map((c) => h("th", {}, c)))),
      h("tbody", {}, ...list.map((t) => {
        const s = statsOf(t);
        const sw = h("button", { class: "switch" + (t.published ? " on" : ""), role: "switch", "aria-checked": String(!!t.published), title: t.published ? "Masquer" : "Rendre visible",
          onclick: (e) => { e.stopPropagation(); quickToggle(t, "published", renderAll); } });
        const st = h("button", { class: "star" + (t.featured ? " on" : ""), title: t.featured ? "Retirer de la une" : "Mettre à la une",
          onclick: (e) => { e.stopPropagation(); quickToggle(t, "featured", renderAll); } }, icon("star"));
        return h("tr", { class: "click", onclick: () => go("#/titre/" + t.id) },
          h("td", {}, h("div", { class: "nm" },
            h("div", { class: "thumb", style: t.poster_url ? { backgroundImage: `url("${t.poster_url}")` } : {} }),
            h("div", {}, h("b", {}, t.name), h("small", {}, [t.year, "ordre " + (t.sort ?? 0)].filter(Boolean).join(" · "))))),
          h("td", {}, h("span", { class: "badge" }, t.kind === "film" ? "Film" : "Série")),
          h("td", { class: "num" }, t.kind === "film" ? fmtDur(s.dur) || "—" : `${plural(s.seasons, "saison")} · ${s.eps} ép.`),
          h("td", { class: "num" }, fmtBytes(s.size)),
          h("td", {}, s.issues.length ? h("div", { class: "issues" }, ...s.issues.map((i) => h("span", { class: "pill warn" }, i))) : h("span", { class: "dim" }, "—")),

function newTitle(kind) {
  return { _new: true, id: crypto.randomUUID(), kind, name: "", synopsis: "", year: new Date().getFullYear(), published: true, featured: false, sort: 0, poster_url: null, backdrop_url: null, video_key: null, duration_s: 0, size_bytes: 0, seasons: [] };

// ---------------------------------------------------------------- éditeur d'un titre
function renderEditor(t) {
  const isFilm = t.kind === "film";
  const f = {
    name: h("input", { type: "text", value: t.name, placeholder: isFilm ? "Titre du film" : "Nom de la série" }),
    year: h("input", { type: "number", value: t.year || "", min: 1900, max: 2100 }),
    sort: h("input", { type: "number", value: t.sort ?? 0 }),
    synopsis: h("textarea", { placeholder: "Résumé affiché dans la fiche" }),
    published: h("button", { type: "button", class: "switch" + (t.published ? " on" : ""), role: "switch" }),
    featured: h("button", { type: "button", class: "switch" + (t.featured ? " on" : ""), role: "switch" }),
  };
  f.synopsis.value = t.synopsis || "";
  for (const k of ["published", "featured"]) {
    f[k].checked = !!t[k];
    f[k].onclick = () => { f[k].checked = !f[k].checked; f[k].classList.toggle("on", f[k].checked); markDirty(); };
  }
  let pendingVideo = null; // nouveau film : vidéo choisie avant l'enregistrement
  const err = h("div", { class: "err" });

  // --- état « modifié »
  let dirty = false;
  const state = h("span", { class: "state" });
  const showState = () => {
    state.className = "state" + (dirty ? " dirty" : "");
    state.replaceChildren(dirty ? h("span", { class: "dot" }) : "", t._new ? "Nouveau — pas encore enregistré" : dirty ? "Modifications non enregistrées" : "Tout est enregistré");
  };
  const markDirty = () => { dirty = true; showState(); };
  editorDirty = () => curPage() === "titre" || curPage() === "nouveau" ? dirty || !!(t._new && (f.name.value.trim() || pendingVideo)) : false;
  for (const k of ["name", "year", "sort", "synopsis"]) f[k].addEventListener("input", markDirty);
  leaveGuard = () => {
    if (!dirty && !(t._new && (f.name.value.trim() || pendingVideo))) { leaveGuard = null; return true; }
    if (window.confirm("Quitter sans enregistrer les modifications ?")) { leaveGuard = null; return true; }
    history.replaceState(null, "", t._new ? "#/nouveau/" + t.kind : "#/titre/" + t.id);
    return false;
  };

  const imgBox = (kind) => {
    const key = kind === "poster" ? "poster_url" : "backdrop_url";
    const box = h("div", { class: "imgbox " + kind, title: "Changer l'image" }, t[key] ? "" : (kind === "poster" ? "Affiche\n2:3" : "Image 16:9\n(facultative : sinon\nl'affiche, recadrée au centre)"));
    if (t[key]) box.style.backgroundImage = `url("${t[key]}")`;
    const set = async (file) => {
      if (!file || !/^image\//.test(file.type)) return;
      box.textContent = "Envoi…";
      try {
        t[key] = await uploadImage(file, t.id, kind);
        box.textContent = ""; box.style.backgroundImage = `url("${t[key]}")`;
        if (!t._new) { await save({ [key]: t[key] }); toast("Image enregistrée"); }
        // l'ancienne affiche / bannière (et les envois abandonnés) ne servent plus
        pruneMedia(t.id, [t.poster_url, t.backdrop_url]);
      } catch (e) { box.textContent = "Erreur"; fail(e); }
    };
    box.onclick = async () => set((await pickFiles("image/*"))[0]);
    box.ondragover = (e) => { e.preventDefault(); box.style.borderColor = "var(--grey)"; };
    box.ondragleave = () => (box.style.borderColor = "");
    box.ondrop = (e) => { e.preventDefault(); box.style.borderColor = ""; set(e.dataTransfer.files[0]); };
    return box;
  };

  async function save(patch) {
    const { error } = await sb.from("titles").update(patch).eq("id", t.id);
    if (error) throw error;
    Object.assign(t, patch);
  }

  // --- vidéo du film
  const videoInfo = h("p", { class: "muted", style: { fontSize: "13px", marginBottom: "10px", wordBreak: "break-all" } });
  const showVideoInfo = () => {
    videoInfo.textContent = pendingVideo ? `Prêt à envoyer : ${pendingVideo.name} (${fmtSize(pendingVideo.size)})`
      : t.video_key ? `${t.video_key} · ${fmtSize(t.size_bytes)} · ${fmtDur(t.duration_s)}` : "Aucune vidéo";
  };
  showVideoInfo();
  const pickFilmVideo = async (files) => {
    const [file] = files || await pickFiles("video/*,.mkv");
    if (!file) return;
    if (t._new) { pendingVideo = file; showVideoInfo(); return; }
    if (!(await confirmPlan([file]))) return;
    try {
      const old = videoOf(t);
      const key = `films/${slug(f.name.value || t.name)}-${t.id.slice(0, 8)}-${rand()}.${extOf(file)}`;
      const duration = await probeDuration(file);
      const storageId = await uploadToStore(file, key, t.name);
      await save({ video_key: key, storage_id: storageId, size_bytes: file.size, duration_s: duration || t.duration_s });
      if (old && old.key !== key) storeDelete([old]);
      showVideoInfo(); toast("Vidéo remplacée");
    } catch (e) { fail(e); }
  };

  // --- enregistrement
  const saveBtn = h("button", { onclick: async () => {
    err.textContent = "";
    const row = {
      name: f.name.value.trim(), synopsis: f.synopsis.value.trim(), year: Number(f.year.value) || null,
      sort: Number(f.sort.value) || 0, published: f.published.checked, featured: f.featured.checked,
      poster_url: t.poster_url, backdrop_url: t.backdrop_url,
    };
    if (!row.name) { f.name.focus(); return (err.textContent = "Le nom est obligatoire."); }
    saveBtn.disabled = true;
    try {
      if (t._new) {
        if (isFilm) {
          if (!pendingVideo) { saveBtn.disabled = false; return (err.textContent = "Choisis la vidéo du film."); }
          if (!(await confirmPlan([pendingVideo]))) { saveBtn.disabled = false; return; }
          const key = `films/${slug(row.name)}-${t.id.slice(0, 8)}-${rand()}.${extOf(pendingVideo)}`;
          const duration = await probeDuration(pendingVideo);
          const storageId = await uploadToStore(pendingVideo, key, row.name);
          Object.assign(row, { video_key: key, storage_id: storageId, size_bytes: pendingVideo.size, duration_s: duration });
          pendingVideo = null;
        }
        const { data, error } = await sb.from("titles").insert({ id: t.id, kind: t.kind, ...row }).select("*").single();
        if (error) { if (row.video_key) storeDelete([videoOf(row)]); throw error; }
        Object.assign(t, data, { seasons: [] });
        delete t._new;
        titles.unshift(t);
        toast(isFilm ? "Film ajouté" : "Série créée — ajoute une saison");
        leaveGuard = null;
        history.replaceState(null, "", "#/titre/" + t.id);
        route();
        return;
      }
      await save(row);
      dirty = false; showState(); renderNav();
      $("crumbs").lastElementChild.textContent = t.name;
      toast("Enregistré");
    } catch (e) { err.textContent = e.message; }
    saveBtn.disabled = false;
  } }, icon("save"), t._new ? (isFilm ? "Envoyer et créer le film" : "Créer la série") : "Enregistrer", h("kbd", { style: { color: "#555", borderColor: "#999" } }, "Ctrl S"));

  const delBtn = !t._new && h("button", { class: "danger", onclick: async () => {
    const n = t.seasons.reduce((a, s) => a + s.episodes.length, 0);
    if (!(await uiConfirm(`Supprimer « ${t.name} »${n ? ` et ses ${n} épisodes` : ""} ? Les vidéos et les images seront effacées du stockage.`, { title: "Supprimer ce titre", ok: "Supprimer", danger: true }))) return;
    const vids = [videoOf(t), ...t.seasons.flatMap((s) => s.episodes.map(videoOf))];
    const { error } = await sb.from("titles").delete().eq("id", t.id);
    if (error) return fail(error);
    storeDelete(vids);
    pruneMedia(t.id);
    titles = titles.filter((x) => x !== t);
    toast("Supprimé");
    leaveGuard = null;
    go("#/catalogue");
  } }, icon("trash"), "Supprimer");

  const filmDrop = isFilm && dropZone(t.video_key ? "Remplacer la vidéo : glisse-la ici ou clique" : "Glisse la vidéo ici ou clique pour choisir", pickFilmVideo, false);
  const st = statsOf(t);

  setTop([{ label: "Catalogue", href: "#/catalogue" }, { label: t._new ? (isFilm ? "Nouveau film" : "Nouvelle série") : t.name }],
    t._new ? [] : [h("button", { class: "ghost sm", onclick: () => go("#/catalogue") }, icon("back"), h("span", { class: "lbl" }, "Retour"))]);

  const toggleRow = (sw, title, sub) => h("div", { class: "toggle-row" }, h("div", {}, h("b", {}, title), h("small", {}, sub)), sw);

  $("main").replaceChildren(
    h("div", { class: "phead" }, h("div", { class: "t" },
      h("div", { class: "row", style: { gap: "8px", marginBottom: "4px" } },
        h("span", { class: "badge" }, isFilm ? "Film" : "Série"),
        t._new ? "" : h("span", { class: "pill " + (t.published ? "ok" : "off") }, t.published ? "visible" : "masqué"),
        t.featured ? h("span", { class: "pill feat" }, "★ à la une") : "",
        ...st.issues.map((i) => h("span", { class: "pill warn" }, "manque : " + i))),
      h("h2", {}, t._new ? (isFilm ? "Nouveau film" : "Nouvelle série") : t.name))),
    h("div", { class: "ed" },
      h("div", {},
        h("div", { class: "card" },
          h("div", { class: "ptitle" }, h("h3", {}, "Informations")),
          h("label", { style: { marginTop: 0 } }, "Nom"), f.name,
          h("div", { class: "grid2" },
            h("div", {}, h("label", {}, "Année"), f.year),
            h("div", {}, h("label", {}, "Ordre d'affichage (petit = en premier)"), f.sort),
          ),
          h("label", {}, "Résumé"), f.synopsis,
        ),
        isFilm ? h("div", { class: "card" }, h("div", { class: "ptitle" }, h("h3", {}, "Vidéo")), videoInfo, filmDrop) : "",
        !isFilm && !t._new ? seasonsCard(t) : "",
        !isFilm && t._new ? h("div", { class: "card empty" }, icon("tv"), h("div", {}, "Les saisons et épisodes s'ajoutent après la création de la série.")) : "",
      ),

function dropZone(text, onFiles, multiple) {
  const z = h("div", { class: "drop" }, icon("upload"), text);
  z.onclick = async () => onFiles(await pickFiles("video/*,.mkv", multiple));
  z.ondragover = (e) => { e.preventDefault(); z.classList.add("over"); };
  z.ondragleave = () => z.classList.remove("over");
  z.ondrop = (e) => {
    e.preventDefault(); z.classList.remove("over");
    const files = [...e.dataTransfer.files].filter((f) => /^video\//.test(f.type) || /\.(mkv|mp4|m4v|mov)$/i.test(f.name));
    if (files.length) onFiles(multiple ? files : files.slice(0, 1));
  };
  return z;
}

async function usersFn(body) {

const REQ_KIND = { request: "Série / film", feedback: "Avis", bug: "Problème", other: "Autre" };
const REQ_STATUS = { new: "nouvelle", seen: "vue", done: "traitée" };

/** Demandes de séries / films, avis, problèmes envoyés depuis l'app. Réponse visible dans l'app. */
function requestsCard() {
  const card = h("div", { class: "card" });

  let kind = "";       // "" = tous les types
  const byUser = () => Object.fromEntries(users.map((u) => [u.user_id, u]));

  async function update(r, patch, msg) {
    const { error } = await sb.from("user_requests").update(patch).eq("id", r.id);
    if (error) return fail(error);
    Object.assign(r, patch);
    render(); renderNav();
    if (msg) toast(msg);
  }

  const render = () => {
    const who = byUser();
    const inFilter = (r, fl) => fl === "all" || (fl === "done" ? r.status === "done" : r.status !== "done");
    const list = requests.filter((r) => inFilter(r, filter) && (!kind || r.kind === kind));
    const chip = (label, on, onclick, n) => h("button", { class: "chip" + (on ? " on" : ""), onclick }, label, n != null ? h("span", { class: "n" }, n) : "");
    card.replaceChildren(

        chip("À traiter", filter === "open", () => { filter = "open"; render(); }, requests.filter((r) => inFilter(r, "open")).length),
        chip("Traitées", filter === "done", () => { filter = "done"; render(); }, requests.filter((r) => inFilter(r, "done")).length),
        chip("Toutes", filter === "all", () => { filter = "all"; render(); }, requests.length),
        h("span", { class: "sp" }),
        chip("Tous types", !kind, () => { kind = ""; render(); }),
        ...Object.entries(REQ_KIND).map(([k, label]) => chip(label, kind === k, () => { kind = kind === k ? "" : k; render(); })),
      ),
      list.length ? h("div", {}, ...list.map((r) => requestRow(r, who[r.user_id])))
        : h("div", { class: "empty" }, icon("inbox"), h("div", {}, "Aucune requête ici.")),
    );
  };

  function requestRow(r, u) {
    const date = new Date(r.created_at).toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });

        h("span", { class: "muted" }, "— ", u ? (u.name || u.email) : "compte supprimé"),
        h("small", {}, [u?.email, date, r.app_version && "v" + r.app_version].filter(Boolean).join(" · ")),
      ),
      h("span", { class: "st " + r.status }, REQ_STATUS[r.status] || r.status),

      r.status !== "done" ? h("button", { class: "link", onclick: () => update(r, { status: "done" }, "Requête traitée") }, "Traitée") : "",
      r.status === "done" ? h("button", { class: "link", onclick: () => update(r, { status: "seen" }) }, "Rouvrir") : "",
      h("button", { class: "link", onclick: async () => {
        const txt = await uiPrompt(r.reply ? "Modifier la réponse" : "Répondre", r.reply || "", { type: "textarea", text: "Affichée dans l'app. Vide = aucune réponse.\n\n« " + r.message.slice(0, 200) + (r.message.length > 200 ? "…" : "") + " »" });
        if (txt === null) return;
        const reply = txt.trim() || null;
        update(r, reply ? { reply, status: r.status === "new" ? "seen" : r.status } : { reply }, reply ? "Réponse enregistrée" : "Réponse retirée");
      } }, r.reply ? "Modifier la réponse" : "Répondre"),

        if (!(await uiConfirm("Supprimer cette requête ?", { ok: "Supprimer", danger: true }))) return;

      h("div", { class: "msg" }, r.message),
      r.reply ? h("div", { class: "reply" }, "↳ Ta réponse : ", r.reply) : "",
    );
    return row;
  }

  render();
  return card;
}

// ---------------------------------------------------------------- médias orphelins
/**
 * Images / GIF / vidéos d'annonces (buckets Supabase) qui ne sont plus utilisés nulle part :
 * ni par un titre, ni par une annonce, ni par une version publiée ou la prochaine version.
 * Les fichiers de moins d'une heure sont ignorés (envoi en cours, fiche pas encore enregistrée).
 */
async function findOrphans() {
  // Toutes les lignes, page par page : Supabase plafonne une requête à 1000 lignes,
  // et une ligne non lue ferait passer son image pour inutilisée.
  const all = async (table, cols) => {
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from(table).select(cols).range(from, from + 999);
      if (error) throw error;
      rows.push(...data);
      if (data.length < 1000) return rows;
    }
  };
  const [t, a, v, n, ev] = await Promise.all([
    all("titles", "poster_url, backdrop_url"),
    all("announcements", "image_url, video_url"),
    all("app_versions", "image_url, video_url"),
    sb.from("app_settings").select("value").eq("key", "next_release").maybeSingle(),
    // Couvertures des soirées ciné (si la table n'existe pas encore : aucune). Une erreur réelle arrête tout.
    all("events", "cover_url").catch((e) => { if (String(e?.message || e).includes("events")) return []; throw e; }),
  ]);
  if (n.error) throw n.error;
  // Toutes les URL citées, quel que soit leur format (domaine, ?paramètres, /render/image/…).
  const refs = [
    ...t.flatMap((x) => [x.poster_url, x.backdrop_url]),
    ...a.flatMap((x) => [x.image_url, x.video_url]),
    ...v.flatMap((x) => [x.image_url, x.video_url]),
    ...ev.map((x) => x.cover_url),
    JSON.stringify(n.data?.value || {}),
  ].filter(Boolean).map((u) => { try { return decodeURIComponent(u); } catch { return u; } }).join("\n");
  // Un fichier est « utilisé » dès que son chemin apparaît quelque part : en cas de doute, on garde.
  const isUsed = (bucket, path) => refs.includes(`/${bucket}/${path}`) || refs.includes(path);
  const limit = Date.now() - 3600e3;
  const out = [];
  for (const bucket of MEDIA_BUCKETS) {
    const { data: root, error } = await sb.storage.from(bucket).list("", { limit: 1000 });
    if (error) throw error;
    // « releases » : visuels des versions, aussi lus par les fichiers JSON du FTP → jamais touchés ici.
    for (const dir of (root || []).filter((x) => !x.id && x.name !== "releases")) {
      for (const f of await listFolder(bucket, dir.name)) {
        if (isUsed(bucket, f.path)) continue;
        if (new Date(f.created_at || f.updated_at || 0).getTime() > limit) continue;
        out.push({ bucket, path: f.path, size: f.metadata?.size || 0 });
      }
    }
  }
  return out;
}

const fmtKo = (b) => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + " Ko" : (b / 1048576).toFixed(1).replace(".", ",") + " Mo";
function mediaCleanCard() {
  const info = h("p", { class: "muted", style: { fontSize: "13px", margin: "6px 0 12px" } },
    "Les médias sont effacés automatiquement quand tu supprimes ou remplaces un titre, une image ou une annonce. Ce bouton rattrape les fichiers restés avant ce nettoyage ou après un envoi abandonné.");
  const btn = h("button", { class: "ghost", onclick: async () => {
    btn.disabled = true; btn.textContent = "Analyse…";
    try {
      const list = await findOrphans();
      if (!list.length) { toast("Aucun média orphelin"); return; }
      const size = list.reduce((s, x) => s + x.size, 0);
      const names = list.slice(0, 8).map((x) => "• " + x.bucket + "/" + x.path).join("\n") + (list.length > 8 ? `\n… et ${list.length - 8} autre(s)` : "");
      console.table(list);
      if (!(await uiConfirm(`${list.length} fichier${list.length > 1 ? "s" : ""} inutilisé${list.length > 1 ? "s" : ""} (${fmtKo(size)}), liés à aucun titre, annonce ou version :\n\n${names}\n\nLes supprimer ?`,
        { title: "Médias orphelins", ok: "Supprimer", danger: true }))) return;
      for (const bucket of MEDIA_BUCKETS) {
        const paths = list.filter((x) => x.bucket === bucket).map((x) => x.path);
        for (let i = 0; i < paths.length; i += 100) {
          const { error } = await sb.storage.from(bucket).remove(paths.slice(i, i + 100));
          if (error) throw error;
        }
      }
      toast(`${list.length} fichier${list.length > 1 ? "s" : ""} supprimé${list.length > 1 ? "s" : ""} · ${fmtKo(size)} libérés`);
    } catch (e) { fail(e); }
    finally { btn.disabled = false; btn.textContent = "Nettoyer les médias orphelins"; }
  } }, "Nettoyer les médias orphelins");
  return h("div", { class: "card", style: { marginTop: "16px" } },
    h("div", { class: "ptitle" }, h("h3", {}, "Images et médias d'annonces")), info, btn);
}

// ---------------------------------------------------------------- stockages (pool)
const fmtBytes = (b) => !b ? "0 Go" : b >= 1e9 ? (b / 1e9).toFixed(2).replace(".", ",") + " Go" : Math.round(b / 1e6) + " Mo";
const pct = (used, quota) => quota > 0 ? Math.round((used / quota) * 100) : 100;
const PROVIDERS = { r2: "Cloudflare R2", b2: "Backblaze B2", s3: "Autre S3" };
// Mêmes valeurs par défaut que grant_download() : R2 = sortie gratuite, le reste a un budget journalier.
const isBillable = (x) => x.billable ?? x.provider !== "r2";
const billKey = (x) => (x.billing_group || "").trim() || x.id;
const egressCap = (x) => x.daily_egress_bytes ?? 900e6;
const classBCap = (x) => x.daily_class_b ?? 2250;
const classCCap = (x) => x.daily_class_c ?? 2250;
const usageOf = (x) => usageToday.find((u) => u.bill_key === billKey(x)) || { egress_bytes: 0, class_b: 0, class_c: 0, downloads: 0, refused: 0 };

function meter(used, quota) {
  const p = pct(used, quota);
  return h("div", { class: "meter" }, h("i", { class: p >= 100 ? "full" : p >= 90 ? "warn" : "", style: { width: Math.min(100, p) + "%" } }));
}

/** Ordre de remplissage : stockages actifs, par priorité (ou celui imposé). */
function fillOrder() {
  return storages
    .filter((x) => x.active && (!preferredStorage || x.id === preferredStorage))
    .sort((a, b) => a.priority - b.priority || String(a.created_at).localeCompare(String(b.created_at)));
}

/** Simule la répartition d'un envoi (même algorithme que le serveur : premier stockage qui a la place). */
const NEARLY_FULL = 1e9; // automatique : moins de 1 Go libre = considéré plein (comme reserve_storage)
function simulate(files) {
  const pool = fillOrder().map((x) => ({ st: x, free: Math.max(0, x.quota_bytes - x.used_bytes), add: 0 }));
  const missing = [];
  for (const f of files) {
    const fits = (p) => p.free >= f.size;
    const roomy = (p) => preferredStorage || p.st.quota_bytes - p.st.used_bytes - p.add >= NEARLY_FULL;
    const slot = pool.find((p) => fits(p) && roomy(p)) || pool.find(fits);
    if (slot) { slot.free -= f.size; slot.add += f.size; } else missing.push(f);
  }
  return { slots: pool.filter((p) => p.add > 0), missing };
}

/** Affiche le plan d'envoi ; demande confirmation s'il y a un risque (débordement, stockage presque plein). */
async function confirmPlan(files) {
  if (!storagesAvailable || !storages.length) return true;
  const total = files.reduce((a, f) => a + f.size, 0);
  const { slots, missing } = simulate(files);
  const lines = [`Envoi : ${files.length} fichier${files.length > 1 ? "s" : ""} · ${fmtBytes(total)}`];
  const warns = [];
  for (const sl of slots) {
    const after = sl.st.used_bytes + sl.add;
    const p = pct(after, sl.st.quota_bytes);
    lines.push(`→ ${sl.st.name} : +${fmtBytes(sl.add)} (après : ${fmtBytes(after)} / ${fmtBytes(sl.st.quota_bytes)}, ${p} %)`);
    if (p >= 90) warns.push(`⚠️ ${sl.st.name} sera rempli à ${p} %.`);
  }
  if (missing.length) {
    warns.push(`⛔ ${missing.length} fichier${missing.length > 1 ? "s" : ""} (${fmtBytes(missing.reduce((a, f) => a + f.size, 0))}) ne rentre${missing.length > 1 ? "nt" : ""} dans aucun stockage : ${missing.length > 1 ? "ils échoueront" : "il échouera"}. Ajoute un stockage ou augmente un quota.`);
  }
  const act = fillOrder();
  const poolUsed = act.reduce((a, x) => a + x.used_bytes, 0) + total;
  const poolQuota = act.reduce((a, x) => a + x.quota_bytes, 0);
  if (poolQuota && pct(poolUsed, poolQuota) >= 90) warns.push(`⚠️ Le pool sera rempli à ${pct(poolUsed, poolQuota)} % au total.`);
  if (warns.length) return uiConfirm([...lines, "", ...warns].join("\n"), { title: "Vérifier l'envoi", ok: "Continuer l'envoi" });
  toast(lines.join("\n"), 4000);
  return true;
}

function storageCard() {
  const card = h("div", { class: "card" });
  let editing = null; // null | "new" | storage

  const render = () => {
    const act = storages.filter((x) => x.active);
    const used = act.reduce((a, x) => a + x.used_bytes, 0);
    const quota = act.reduce((a, x) => a + x.quota_bytes, 0);
    const dest = h("select", { style: { width: "auto", maxWidth: "240px" }, title: "Où envoyer les prochaines vidéos" },
      h("option", { value: "" }, "Destination : automatique"),
      ...storages.filter((x) => x.active).map((x) => h("option", { value: x.id, selected: x.id === preferredStorage }, "Uniquement : " + x.name)),
    );
    dest.onchange = () => { preferredStorage = dest.value; };
    card.replaceChildren(
      h("div", { class: "toolbar" },
        dest,
        h("span", { class: "sp" }),
        h("button", { class: "ghost sm", onclick: recompute, title: "Recalcule l'espace utilisé à partir des vidéos enregistrées" }, "Recalculer"),
        h("button", { class: "sm", onclick: () => { editing = "new"; render(); } }, icon("plus"), "Stockage"),
      ),
      h("div", { class: "sform", style: { marginTop: 0 } },
        h("div", { class: "row", style: { fontSize: "14px" } },
          h("b", { style: { flex: 1 } }, `Pool : ${fmtBytes(used)} / ${fmtBytes(quota)}`),
          h("span", { class: "muted" }, `${pct(used, quota)} % · reste ${fmtBytes(act.reduce((a, x) => a + Math.max(0, x.quota_bytes - x.used_bytes), 0))}`)),
        meter(used, quota),
      ),
      editing === "new" ? storageForm(null) : "",
      h("div", { style: { marginTop: "8px" } }, ...storages.map((x) => storeRow(x))),
    );
  };
  poolRender = render;

  async function recompute() {
    const { error } = await sb.rpc("recompute_storage_usage");
    if (error) return fail(error);
    const { data } = await sb.from("storage_backends").select("id, used_bytes");
    for (const r of data || []) { const x = storages.find((y) => y.id === r.id); if (x) x.used_bytes = r.used_bytes; }
    render(); renderNav(); toast("Espace recalculé");
  }

  function storeRow(x) {
    const p = pct(x.used_bytes, x.quota_bytes);
    const status = h("span", { class: "muted", style: { fontSize: "13px" } });
    const test = async () => {
      status.textContent = "Test…";
      try {
        const r = await r2({ action: "test", storage_id: x.id });
        status.textContent = r.ok ? "✓ connexion OK" : "✗ " + r.error;
        status.style.color = r.ok ? "var(--ok)" : "var(--danger)";
      } catch (e) { status.textContent = "✗ " + e.message; status.style.color = "var(--danger)"; }
    };
    // Pose la règle CORS qui autorise l'envoi depuis cette page (B2 : s3_put n'est pas proposé dans leur interface web).
    const cors = async () => {
      const host = location.hostname.replace(/^www\./, "");
      const origins = [...new Set([location.origin, `https://${host}`, `https://www.${host}`])];
      status.textContent = "Configuration CORS…"; status.style.color = "";
      try {
        let r = await r2({ action: "setup-cors", storage_id: x.id, origins });
        if (!r.ok && r.need_master_key) {
          const k = await uiForm({
            title: "Clé maître B2", text: "Cette clé ne peut pas modifier le bucket. Clé maître B2 : utilisée une seule fois, jamais enregistrée.", ok: "Configurer",
            fields: [{ key: "kid", label: "keyID" }, { key: "ak", label: "applicationKey", type: "password" }],
          });
          if (k?.kid && k?.ak) r = await r2({ action: "setup-cors", storage_id: x.id, origins, key_id: k.kid.trim(), app_key: k.ak.trim() });
        }
        status.textContent = r.ok ? "✓ CORS configuré (actif sous quelques minutes)" : "✗ " + r.error;
        status.style.color = r.ok ? "var(--ok)" : "var(--danger)";
      } catch (e) { status.textContent = "✗ " + e.message; status.style.color = "var(--danger)"; }
    };
    return h("div", { class: "store" + (x.active ? "" : " off") },
      h("div", { class: "row", style: { gap: "6px" } },
        h("b", { style: { marginRight: "4px" } }, x.name),
        h("span", { class: "tag" }, PROVIDERS[x.provider] || x.provider),
        x.is_env ? h("span", { class: "tag" }, "secrets GitHub") : "",
        x.active ? "" : h("span", { class: "tag" }, "désactivé"),
        h("span", { class: "tag" }, "priorité " + x.priority),
        limitsAvailable ? h("span", { class: "tag", title: isBillable(x) ? "Budget journalier protégé par la limitation des téléchargements" : "Téléchargements non limités par ce stockage" },
          isBillable(x) ? "facturable" + (x.billing_group ? " · " + x.billing_group : "") : "sortie gratuite") : "",
        h("span", { style: { flex: 1 } }),
        h("span", { class: "muted", style: { fontSize: "13px" } }, `${fmtBytes(x.used_bytes)} / ${fmtBytes(x.quota_bytes)} · ${p} %`),
      ),
      meter(x.used_bytes, x.quota_bytes),
      limitsAvailable && isBillable(x) ? (() => {
        const u = usageOf(x);
        return h("div", { style: { marginTop: "8px", fontSize: "13px" } },
          h("div", { class: "row" },
            h("span", { style: { flex: 1 } }, `Aujourd'hui (UTC) : ${fmtBytes(u.egress_bytes)} / ${fmtBytes(egressCap(x))} téléchargés`),
            h("span", { class: "muted" }, `classe B ${u.class_b}/${classBCap(x)} · C ${u.class_c}/${classCCap(x)}${u.refused ? ` · ${u.refused} refus` : ""}`)),
          meter(u.egress_bytes, egressCap(x)));
      })() : "",
      h("div", { class: "row", style: { marginTop: "6px", gap: "2px" } },
        h("button", { class: "link", onclick: test }, "Tester"),
        x.is_env ? "" : h("button", { class: "link", onclick: cors, title: "Autorise l'envoi des vidéos depuis cette page" }, "Configurer CORS"),
        h("button", { class: "link", onclick: () => { editing = editing === x ? null : x; render(); } }, editing === x ? "Fermer" : "Modifier"),
        x.is_env ? "" : h("button", { class: "link", style: { color: "var(--danger)" }, onclick: async () => {
          if (!(await uiConfirm(`Supprimer le stockage « ${x.name} » ? (impossible s'il contient encore des vidéos)`, { ok: "Supprimer", danger: true }))) return;
          const { error } = await sb.rpc("admin_delete_storage", { p_id: x.id });
          if (error) return fail(error);
          storages = storages.filter((y) => y !== x);
          if (preferredStorage === x.id) preferredStorage = "";
          render(); renderNav(); toast("Stockage supprimé");
        } }, "Supprimer"),
        status,
      ),
      editing === x ? storageForm(x) : "",
    );
  }

  function storageForm(x) {
    const isNew = !x;
    const envOnly = x?.is_env;
    const v = {
      name: h("input", { type: "text", value: x?.name || "", placeholder: "ex : R2 compte 2, Backblaze…" }),
      provider: h("select", {}, ...Object.entries(PROVIDERS).map(([k, l]) => h("option", { value: k, selected: (x?.provider || "r2") === k }, l))),
      account: h("input", { type: "text", placeholder: "Account ID Cloudflare (32 caractères)" }),
      endpoint: h("input", { type: "text", value: x?.endpoint || "", placeholder: "https://s3.eu-central-003.backblazeb2.com" }),
      region: h("input", { type: "text", value: x?.region && x.region !== "auto" ? x.region : "", placeholder: "ex : eu-central-003 (auto pour R2)" }),
      bucket: h("input", { type: "text", value: x?.bucket || "", placeholder: "nom du bucket" }),
      ak: h("input", { type: "password", autocomplete: "off", placeholder: x?.access_key_vault ? "•••• enregistrée — vide = inchangée" : "Access Key ID / keyID" }),
      sk: h("input", { type: "password", autocomplete: "off", placeholder: x?.secret_key_vault ? "•••• enregistrée — vide = inchangée" : "Secret Access Key / applicationKey" }),
      quota: h("input", { type: "number", step: "0.1", min: "0.1", value: x ? (x.quota_bytes / 1e9).toFixed(1) : "9.5" }),
      priority: h("input", { type: "number", value: x?.priority ?? (Math.max(0, ...storages.map((y) => y.priority)) + 1) }),
      active: h("input", { type: "checkbox", checked: x ? x.active : true }),
      // Nouveau stockage : R2 par défaut, donc non facturable (sortie gratuite). Backblaze : coché.
      billable: h("input", { type: "checkbox", checked: x ? isBillable(x) : false }),
      egress: h("input", { type: "number", min: "0", step: "50", value: x ? Math.round(egressCap(x) / 1e6) : 900 }),
      classB: h("input", { type: "number", min: "0", value: x ? classBCap(x) : 2250 }),
      classC: h("input", { type: "number", min: "0", value: x ? classCCap(x) : 2250 }),
      group: h("input", { type: "text", value: x?.billing_group || "", placeholder: "ex : b2-compte-1 (vide = budget propre)" }),
    };
    // R2 : l'endpoint se déduit de l'Account ID.
    const m = /^https:\/\/([0-9a-f]{32})\.r2\.cloudflarestorage\.com/i.exec(x?.endpoint || "");
    if (m) v.account.value = m[1];
    const err = h("div", { class: "err" });
    const fields = h("div");
    const layout = () => {
      const pr = v.provider.value;
      fields.replaceChildren(
        envOnly ? h("p", { class: "muted", style: { fontSize: "13px", marginTop: "10px" } }, "Stockage d'origine : ses clés sont dans les secrets GitHub (R2_*). Seuls le nom, le quota, la priorité et l'état se modifient ici.") : h("div", {},
          h("label", {}, "Type"), v.provider,
          pr === "r2" ? h("div", {}, h("label", {}, "Account ID Cloudflare"), v.account)
                      : h("div", { class: "grid2" },
                          h("div", {}, h("label", {}, "Endpoint S3"), v.endpoint),
                          h("div", {}, h("label", {}, "Région"), v.region)),
          h("label", {}, "Bucket"), v.bucket,
          h("div", { class: "grid2" },
            h("div", {}, h("label", {}, pr === "b2" ? "keyID" : "Access Key ID"), v.ak),
            h("div", {}, h("label", {}, pr === "b2" ? "applicationKey" : "Secret Access Key"), v.sk)),
        ),
      );
    };
    v.provider.onchange = () => { v.billable.checked = v.provider.value !== "r2"; layout(); };
    layout();

    const save = h("button", { onclick: async () => {
      err.textContent = "";
      const pr = v.provider.value;
      let endpoint = v.endpoint.value.trim().replace(/\/+$/, "");
      let region = v.region.value.trim();
      if (!envOnly && pr === "r2") {
        const acct = v.account.value.trim();
        if (!/^[0-9a-f]{32}$/i.test(acct)) return (err.textContent = "Account ID Cloudflare invalide (32 caractères hexadécimaux).");
        endpoint = `https://${acct}.r2.cloudflarestorage.com`; region = "auto";
      }
      if (!envOnly && pr === "b2" && !region) {
        const r = /s3\.([a-z0-9-]+)\.backblazeb2\.com/i.exec(endpoint); // la région est dans l'endpoint B2
        if (r) region = r[1];
      }
      const name = v.name.value.trim();
      const quotaBytes = Math.round(Number(v.quota.value) * 1e9);
      if (!name) return (err.textContent = "Donne un nom à ce stockage.");
      if (!(quotaBytes > 0)) return (err.textContent = "Quota invalide.");
      if (!envOnly) {
        if (!/^https:\/\//.test(endpoint)) return (err.textContent = "Endpoint invalide (doit commencer par https://).");
        if (!v.bucket.value.trim()) return (err.textContent = "Nom du bucket obligatoire.");
        if (isNew && (!v.ak.value.trim() || !v.sk.value.trim())) return (err.textContent = "Les deux clés sont obligatoires.");
      }
      save.disabled = true;
      const { data: id, error } = await sb.rpc("admin_save_storage", {
        p_id: x?.id || null, p_name: name, p_provider: envOnly ? x.provider : pr, p_endpoint: endpoint || null,
        p_region: region || "auto", p_bucket: v.bucket.value.trim() || null,
        p_access_key: v.ak.value.trim(), p_secret_key: v.sk.value.trim(),
        p_quota_bytes: quotaBytes, p_priority: Number(v.priority.value) || 0, p_active: v.active.checked,
      });
      save.disabled = false;
      if (error) return (err.textContent = error.message);
      if (limitsAvailable) {
        const { error: e2 } = await sb.from("storage_backends").update({
          billable: v.billable.checked,
          daily_egress_bytes: Math.max(0, Math.round(Number(v.egress.value) * 1e6)),
          daily_class_b: Math.max(0, Math.round(Number(v.classB.value))),
          daily_class_c: Math.max(0, Math.round(Number(v.classC.value))),
          billing_group: v.group.value.trim() || null,
        }).eq("id", id);
        if (e2) return (err.textContent = e2.message);
      }
      const { data } = await sb.from("storage_backends")
        .select(STORE_COLS)
        .eq("id", id).single();
      if (data) {
        const i = storages.findIndex((y) => y.id === id);
        i >= 0 ? (storages[i] = data) : storages.push(data);
        storages.sort((a, b) => a.priority - b.priority || String(a.created_at).localeCompare(String(b.created_at)));
      }
      editing = null; render(); renderNav();
      toast(isNew ? "Stockage ajouté — clique sur « Tester »" : "Stockage enregistré");
    } }, isNew ? "Ajouter" : "Enregistrer");

    return h("div", { class: "sform" },
      h("b", {}, isNew ? "Nouveau stockage" : "Modifier « " + x.name + " »"),
      h("label", {}, "Nom"), v.name,
      fields,
      h("div", { class: "grid2" },
        h("div", {}, h("label", {}, "Quota (Go) — garde une marge sous la limite gratuite"), v.quota),
        h("div", {}, h("label", {}, "Priorité (petit = rempli en premier)"), v.priority)),
      limitsAvailable ? h("div", { style: { marginTop: "14px", paddingTop: "10px", borderTop: "1px solid var(--line)" } },
        h("label", { class: "check", style: { display: "flex" } }, v.billable, "Facturable : limiter les téléchargements à un budget gratuit par jour (UTC)"),
        h("div", { class: "grid2" },
          h("div", {}, h("label", {}, "Sortie max / jour (Mo) — B2 : 1 Go gratuit"), v.egress),
          h("div", {}, h("label", {}, "Compte de facturation (budget partagé)"), v.group)),
        h("div", { class: "grid2" },
          h("div", {}, h("label", {}, "Transactions classe B / jour"), v.classB),
          h("div", {}, h("label", {}, "Transactions classe C / jour"), v.classC)),
        h("p", { class: "muted", style: { fontSize: "12px", marginTop: "6px" } },
          "Garde une marge sous les limites gratuites (ex. 900 Mo pour 1 Go). Plusieurs buckets d'un même compte B2 : mets le même nom de compte, ils partageront le budget."),
      ) : "",
      h("label", { class: "check", style: { marginTop: "14px" } }, v.active, "Actif (reçoit de nouvelles vidéos)"),
      h("div", { class: "row", style: { marginTop: "14px" } }, save,
        h("button", { class: "ghost", onclick: () => { editing = null; render(); } }, "Annuler")),

/** Stockage d'un film / épisode, et s'il est gratuit en sortie (R2). */
function storageInfo(storageId) {
  const st = storageId ? storages.find((x) => x.id === storageId) : storages.find((x) => x.is_env);
  const free = st ? !(st.billable ?? st.provider !== "r2") : true;
  return { name: st?.name || "R2 principal", free };
}
/** Tous les contenus projetables (films + épisodes), avec leur stockage. */
function eventMediaOptions() {
  const out = [];

      if (t.video_key) out.push({ id: t.id, label: `Film — ${t.name}`, size: t.size_bytes, dur: t.duration_s, ...storageInfo(t.storage_id) });

}

const AD_RATIOS = { free: "Libre (visuel entier)", portrait: "Portrait 2:3", square: "Carré 1:1", landscape: "Paysage 16:9", wide: "Bandeau 4:1" };
const AD_ASPECT = { portrait: "2/3", square: "1/1", landscape: "16/9", wide: "4/1" };
const adAspect = (ratio, a) => ratio === "free" ? (a?.layout?.aspect ? String(a.layout.aspect) : "16/9") : (AD_ASPECT[ratio] || "16/9");

/** Proportions réelles (largeur / hauteur) d'une image ou d'une vidéo, par son URL. */
function measureAspect(url, isVideo) {
  return new Promise((resolve) => {
    if (!url) return resolve(0);
    const el = document.createElement(isVideo ? "video" : "img");
    const done = (w, h) => resolve(w > 0 && h > 0 ? Math.round((w / h) * 1000) / 1000 : 0);
    if (isVideo) { el.preload = "metadata"; el.onloadedmetadata = () => done(el.videoWidth, el.videoHeight); }
    else el.onload = () => done(el.naturalWidth, el.naturalHeight);
    el.onerror = () => resolve(0);
    el.src = url;
  });
}
const AD_MAX_BYTES = 12 * 1024 * 1024; // même plafond que le bucket « ads »
const AD_MEDIA = { image: "image", gif: "GIF", video: "vidéo" };

/** Envoie un GIF / MP4 tel quel dans le bucket public « ads ». */
async function uploadAdFile(file, id, ext) {
  const path = `${id}/${ext}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from("ads").upload(path, file, { contentType: file.type, upsert: false });
  if (error) throw error;
  return sb.storage.from("ads").getPublicUrl(path).data.publicUrl;
}

/** Vignette JPEG d'une vidéo (image à 0,5 s), affichée par l'app pendant le chargement. */
function videoThumb(file) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video");
    const url = URL.createObjectURL(file);
    v.muted = true; v.preload = "auto"; v.playsInline = true; v.src = url;
    v.onloadeddata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); };
    v.onseeked = () => {
      const c = document.createElement("canvas");
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      c.toBlob((b) => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error("Vignette impossible")); }, "image/jpeg", 0.85);
    };
    v.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Vidéo illisible : utilise un MP4 (H.264)")); };
  });
}
