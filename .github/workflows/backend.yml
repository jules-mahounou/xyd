name: Backend (Supabase)

on:
  workflow_dispatch:
  push:
    paths: ["supabase/**", ".github/workflows/backend.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vérifier la config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Définis SUPABASE_ACCESS_TOKEN (secret) et SUPABASE_PROJECT_REF (variable)."; exit 1
          fi

      # Les migrations sont idempotentes : on les rejoue toutes via l'API Management (pas besoin du mot de passe DB).
      - name: Migrations SQL
        run: |
          q() {
            curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -Rs '{query: .}')"
          }
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            q < "$f" > /dev/null || { echo "::error::Échec de $f (le jeton doit avoir l'accès base de données en écriture)"; exit 1; }
          done
          # URL des Edge Functions, utilisée par le trigger d'inscription (pg_net).
          printf "insert into public.app_settings (key, value) values ('functions', jsonb_build_object('url', 'https://%s.supabase.co/functions/v1')) on conflict (key) do update set value = excluded.value;" "$PROJECT_REF" | q > /dev/null
          if [ -n "$ADMIN_EMAIL" ]; then
            printf "insert into public.admins (user_id) select id from auth.users where lower(email) = lower('%s') on conflict do nothing; select count(*) as admins from public.admins;" \
              "${ADMIN_EMAIL//\'/}" | q
            echo
          else
            echo "::warning::Variable ADMIN_EMAIL absente : aucun admin déclaré."
          fi

      - name: Secrets R2 des Edge Functions
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ]; then echo "::warning::Secrets R2 absents, étape ignorée."; exit 0; fi
          supabase secrets set --project-ref "$PROJECT_REF" \
            R2_ACCOUNT_ID="$R2_ACCOUNT_ID" R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" R2_BUCKET="$R2_BUCKET"

      - name: Secrets SMTP (mail d'inscription)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_PASSWORD" ]; then echo "::warning::Secrets SMTP absents : pas de mail d'inscription."; exit 0; fi
          ARGS=(SMTP_HOST="$SMTP_HOST" SMTP_PORT="$SMTP_PORT" SMTP_USER="$SMTP_USER" SMTP_PASSWORD="$SMTP_PASSWORD")
          [ -n "$SMTP_FROM" ] && ARGS+=(SMTP_FROM="$SMTP_FROM")
          supabase secrets set --project-ref "$PROJECT_REF" "${ARGS[@]}"

      - name: Déployer les Edge Functions
        run: |
          supabase functions deploy video-url --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy admin-r2 --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy notify-signup --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy admin-users --project-ref "$PROJECT_REF" --no-verify-jwt
