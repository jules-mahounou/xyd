name: Backend (Supabase)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vérifier la config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Définis SUPABASE_ACCESS_TOKEN (secret) et SUPABASE_PROJECT_REF (variable)."; exit 1
          fi

      - name: Migrations SQL
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"

      - name: Secrets R2 de l'Edge Function
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ]; then echo "::warning::Secrets R2 absents, étape ignorée."; exit 0; fi
          supabase secrets set --project-ref "$PROJECT_REF" \
            R2_ACCOUNT_ID="$R2_ACCOUNT_ID" R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" R2_BUCKET="$R2_BUCKET"

      - name: Déployer video-url
        run: supabase functions deploy video-url --project-ref "$PROJECT_REF" --no-verify-jwt
