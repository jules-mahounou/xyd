name: Site (xydhub.tech)

on:
  workflow_dispatch:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ vars.FTP_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Injecter la config Supabase dans la page admin
        run: |
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY manquants"; exit 1; }
          sed -i "s#__SUPABASE_URL__#${SUPABASE_URL%/}#; s#__SUPABASE_ANON_KEY__#${SUPABASE_ANON_KEY}#" web/admin/index.html
          grep -q "__SUPABASE_" web/admin/index.html && { echo "::error::placeholder non remplacé"; exit 1; } || true

      - name: Upload FTP
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          [ -n "$FTP_HOST" ] || { echo "::error::Secrets FTP manquants"; exit 1; }
          DIR="${FTP_DIR#/}"; DIR="${DIR%/}"; [ "$DIR" = "." ] && DIR=""
          up() { curl -sS --fail --ftp-create-dirs --user "$FTP_USER:$FTP_PASSWORD" -T "$1" "ftp://$FTP_HOST/${DIR:+$DIR/}$2"; }
          # Push : on n'envoie que les fichiers de web/ modifiés par le push (ex. seulement l'admin).
          # Lancement manuel ou historique introuvable : tout le site est envoyé.
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only --diff-filter=AMR "$BEFORE" "$GITHUB_SHA" -- web/)
            [ -n "$CHANGED" ] || { echo "Aucun fichier du site modifié : rien à envoyer."; exit 0; }
            echo "$CHANGED" | while read -r f; do echo "↑ $f"; up "$f" "${f#web/}"; done
          else
            up web/index.html index.html
            up web/.htaccess .htaccess
            up web/logo.svg logo.svg
            for f in robots.txt sitemap.xml site.webmanifest og-image.png apercu.jpg xyd-v2.mp4 xyd-v2.jpg apple-touch-icon.png icon-192.png icon-512.png; do up "web/$f" "$f"; done
            up web/admin/index.html admin/index.html
          fi
          echo "Site : https://xydhub.tech  ·  Admin : https://xydhub.tech/admin/"
