name: Conversion vidéos (AVI → MP4)

# Lancement manuel : Actions → « Conversion vidéos » → Run workflow.
# Convertit les vidéos que l'app ne lit pas (AVI, WMV, FLV, MPG…) en MP4 H.264 + AAC, puis remplace l'original.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Liste seulement (aucune modification)"
        type: boolean
        default: true

concurrency: { group: convert-videos, cancel-in-progress: false }

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3] }   # 4 machines en parallèle, chacune sa part des vidéos
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      SHARD: ${{ matrix.shard }}
      SHARDS: 4
      MAX_MINUTES: 320
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q boto3
      - name: Conversion
        run: python3 -u .github/scripts/convert_videos.py
